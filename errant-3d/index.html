<script>
'use strict';
let errCount=0;window.addEventListener('error',e=>{errCount++;document.getElementById('err').textContent='Erreur : '+(e.message||e);});
const cv=document.getElementById('gl'),ov=document.getElementById('ov'),ox=ov.getContext('2d');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,depth:true,powerPreference:'high-performance'});
if(!gl){document.getElementById('title').innerHTML='<p style="padding:30px;text-transform:none;letter-spacing:0">WebGL2 n\'est pas disponible sur cet appareil.</p>';throw new Error('no webgl2');}

/* ---------- maths ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sst=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
let seed=1234567;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
function hsh(x,z){let h=Math.imul(x|0,374761393)+Math.imul(z|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=hsh(xi,zi),b=hsh(xi+1,zi),c=hsh(xi,zi+1),d=hsh(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vn(x*f+i*17.3,z*f-i*9.1);f*=2.03;a*=.5;}return s;}
const M4=()=>{const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;};
function ident(m){m.fill(0);m[0]=m[5]=m[10]=m[15]=1;return m;}
function mul(o,a,b){const t=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];t[i*4+j]=s;}o.set(t);return o;}
function tr(m,x,y,z){for(let i=0;i<4;i++)m[12+i]+=m[i]*x+m[4+i]*y+m[8+i]*z;return m;}
function sc(m,x,y,z){for(let i=0;i<4;i++){m[i]*=x;m[4+i]*=y;m[8+i]*=z;}return m;}
function ry(m,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const x=m[i],z=m[8+i];m[i]=x*c-z*s;m[8+i]=x*s+z*c;}return m;}
function rx(m,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const y=m[4+i],z=m[8+i];m[4+i]=y*c+z*s;m[8+i]=-y*s+z*c;}return m;}
function rz(m,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const x=m[i],y=m[4+i];m[i]=x*c+y*s;m[4+i]=-x*s+y*c;}return m;}
function persp(o,fy,a,n,f){const t=1/Math.tan(fy/2);o.fill(0);o[0]=t/a;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function ortho(o,l,r,b,t,n,f){o.fill(0);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o;}
function lookAt(o,e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;return o;}
function inv(o,a){const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;det=1/det;
o[0]=(a11*b11-a12*b10+a13*b09)*det;o[1]=(a02*b10-a01*b11-a03*b09)*det;o[2]=(a31*b05-a32*b04+a33*b03)*det;o[3]=(a22*b04-a21*b05-a23*b03)*det;
o[4]=(a12*b08-a10*b11-a13*b07)*det;o[5]=(a00*b11-a02*b08+a03*b07)*det;o[6]=(a32*b02-a30*b05-a33*b01)*det;o[7]=(a20*b05-a22*b02+a23*b01)*det;
o[8]=(a10*b10-a11*b08+a13*b06)*det;o[9]=(a01*b08-a00*b10-a03*b06)*det;o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det;return o;}
function nmat(m,o){const a=m[0],b=m[1],c=m[2],d=m[4],e=m[5],f=m[6],g=m[8],h=m[9],i=m[10];o=o||new Float32Array(9);
o[0]=e*i-f*h;o[1]=f*g-d*i;o[2]=d*h-e*g;o[3]=c*h-b*i;o[4]=a*i-c*g;o[5]=b*g-a*h;o[6]=b*f-c*e;o[7]=c*d-a*f;o[8]=a*e-b*d;return o;}
function xp4(m,x,y,z){const w=m[3]*x+m[7]*y+m[11]*z+m[15];return[(m[0]*x+m[4]*y+m[8]*z+m[12])/w,(m[1]*x+m[5]*y+m[9]*z+m[13])/w,(m[2]*x+m[6]*y+m[10]*z+m[14])/w,w];}
const srgb=c=>c.map(v=>Math.pow(v,2.2));
const mixv=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);

/* ---------- monde : terrain ---------- */
const WS=800,GN=256,GS=WS/GN,TOWN_R=34,TOWN_Y=1.2;
const TOWNS=[{id:'fp',n:'Fort-Poussière',x:0,z:0,R:34,y:1.2,g:[Math.PI/2,-Math.PI/2],gw:3.2,wh:7.6,fort:1,shop:['kit','machette','sabre','hache','lance','turban','casque','cuir','maille']},
 {id:'ap',n:'Avant-poste',x:22,z:-186,R:25,y:2,g:[Math.atan2(186,-22)],gw:3,wh:3.6,arena:1,shop:['kit','sabre','hache','lance','katana','arbalete','casque','kabuto','cuir','maille']},
 {id:'ro',n:"Refuge d'Ombre",x:176,z:118,R:23,y:2,g:[Math.atan2(-118,-176)],gw:3,wh:3.6,shop:['kit','katana','nodachi','arbalete','arbalourde','casque','kabuto','maille','samurai']},
 {id:'base',n:'Ta base',x:-128,z:-150,R:17,y:2,g:[Math.atan2(150,128)],gw:3,wh:1.6,base:1}];
const REG={burnt:{x:150,z:-135,r:62,fog:[.42,.34,.3],c:[.24,.2,.19]},marsh:{x:62,z:182,r:52,fog:[.4,.46,.36],c:[.31,.35,.2]},faille:{x:-196,z:-30,r:50,fog:[.28,.2,.36],c:[.2,.15,.24]}};
function regW(k,x,z){const r=REG[k];return sst(r.r+12,r.r-14,Math.hypot(x-r.x,z-r.z));}
const ASH1={x:132,z:-118},ASHB={x:170,z:-158},BOG1={x:44,z:170},BOGB={x:88,z:194},WR1={x:-176,z:-12},WRB={x:-204,z:-46};
const angd=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function townAt(x,z,m=1){for(const t of TOWNS)if(Math.hypot(x-t.x,z-t.z)<t.R-m)return t;return null;}
function nearTown(x,z,f){let b=null,bd=1e9;for(const t of TOWNS){if(f&&!f(t))continue;const d=Math.hypot(x-t.x,z-t.z);if(d<bd){bd=d;b=t;}}return b;}
const POND={x:-52,z:34,r:14},CAMP={x:72,z:-84},SKEL={x:-86,z:-58},RUIN={x:64,z:58},CAMP2={x:-36,z:128},NOMAD={x:150,z:-16},NEST={x:-150,z:92};
const PATHS=[[[78,-90],[108,-104],[126,-114]],[[150,128],[110,160],[60,172]],[[-86,-40],[-130,-24],[-168,-14]],[[0,-40],[8,-110],[20,-158]],[[56,6],[110,60],[158,104]],[[-6,-40],[-50,-90],[-112,-138]],[[0,40],[-8,80],[-30,112]],[[52,2],[100,-8],[136,-16]],[[-60,46],[-100,64],[-138,86]],[[0,34],[0,58],[-22,52],[-40,40]],[[0,-34],[6,-58],[34,-74],[60,-82]],[[0,-40],[30,-30],[46,-10],[52,2]],[[0,40],[30,40],[56,30],[64,50]]];
function dSeg(px,pz,a,b){const vx=b[0]-a[0],vz=b[1]-a[1],t=clamp(((px-a[0])*vx+(pz-a[1])*vz)/(vx*vx+vz*vz),0,1);return Math.hypot(px-a[0]-vx*t,pz-a[1]-vz*t);}
function pathD(x,z){let d=1e9;for(const p of PATHS)for(let i=0;i<p.length-1;i++)d=Math.min(d,dSeg(x,z,p[i],p[i+1]));return d;}
function hRaw(x,z){
  let h=fbm(x*.0075+11,z*.0075-7)*24-9;
  const r=vn(x*.017+3,z*.017+9);h+=Math.pow(1-Math.abs(r*2-1),2)*7.5;
  h+=Math.sin(x*.021+z*.008)*2.4;
  const pd=pathD(x,z);h=lerp(h*.55+1.2,h,sst(4,26,pd));
  for(const t of TOWNS){const d=Math.hypot(x-t.x,z-t.z);h=lerp(t.y,h,sst(t.R+8,t.R+44,d));}
  const dp=Math.hypot(x-POND.x,z-POND.z);h=lerp(1.0,h,sst(POND.r+8,POND.r+30,dp));h=lerp(-2.2,h,sst(POND.r-7,POND.r+4,dp));
  const dc=Math.hypot(x-CAMP.x,z-CAMP.z);h=lerp(2.2,h,sst(18,34,dc));

  for(const c of CH){if(c===PL||c.dead)continue;const p=proj(c.x,c.y+1.1,c.z);if(!p)continue;const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=c;}}
  let ore=null;for(const o of ORE){const p=proj(o.x,o.y+.8,o.z);if(!p)continue;const d=Math.hypot(p[0]-x,p[1]-y);if(d<Math.min(bd,60)){bd=d;ore=o;best=null;}}
  if(ore){PL.mine=ore;PL.tgt=null;PL.dest=null;PL.talk=null;return;}
  if(best){PL.talk=null;if(best.team==='bandit'||best.kind==='dummy'){PL.tgt=best;PL.dest=null;return;}if(duel&&best===duel.w){PL.tgt=best;return;}PL.tgt=null;PL.dest=null;PL.talk=best;return;}

  let t=0,hit=null;for(;t<400;t+=.5){const px=a[0]+dx/l*t,py=a[1]+dy/l*t,pz=a[2]+dz/l*t;if(py<hAt(px,pz)){let lo=t-.5,hi=t;for(let k=0;k<8;k++){const m=(lo+hi)/2;if(a[1]+dy/l*m<hAt(a[0]+dx/l*m,a[2]+dz/l*m))hi=m;else lo=m;}hit=[a[0]+dx/l*hi,a[2]+dz/l*hi];break;}}
