<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141924">
  <meta name="description" content="Dernière Sirène. Contenez l’infection et sauvez les civils dans six villes réelles.">
  <title>Dernière Sirène</title>
  <link rel="icon" type="image/png" href="./signal.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" class="app title">
    <div id="stage" class="stage">
      <canvas id="world" aria-label="Carte tactique 3D"></canvas>
      <div id="pins"></div>
      <div class="stage-vignette" aria-hidden="true"></div>
      <a id="map-source" class="map-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" hidden>© Contributeurs d’OpenStreetMap</a>
    </div>
    <header id="topbar" class="topbar"></header>
    <div id="screen"></div>
    <section id="hud" class="hud" hidden>
      <div id="metrics" class="metrics"></div>
      <section id="brief" class="brief" aria-live="polite"></section>
      <aside id="unit-inspector" class="unit-inspector" aria-labelledby="unit-name" hidden>
        <header>
          <div><h2 id="unit-name"></h2><div id="unit-equipment"></div></div>
          <button class="small close-unit" data-action="unit-close" aria-label="Fermer la fiche">×</button>
        </header>
        <dl class="unit-stats">
          <div><dt>Portée max.</dt><dd><strong id="unit-range"></strong><small id="unit-range-next"></small></dd></div>
          <div><dt>Dégâts / tir</dt><dd><strong id="unit-hit"></strong><small id="unit-hit-next"></small></dd></div>
          <div><dt>Intégrité</dt><dd><strong id="unit-health"></strong></dd></div>
        </dl>
        <button id="unit-upgrade" class="button primary" data-action="upgrade-unit"></button>
        <small id="unit-note" class="unit-note"></small>
      </aside>
      <div class="radar">
        <canvas id="radar" width="125" height="95" aria-label="Minicarte. Touchez pour recentrer la caméra."></canvas>
        <div><span class="dot civilian"></span> Civils <span class="dot infection"></span> Infection</div>
      </div>
      <div class="camera" aria-label="Caméra">
        <button id="projection" data-action="projection" aria-label="Vue tactique">Plan</button>
        <button data-action="zoom-in" aria-label="Rapprocher">+</button>
        <button data-action="zoom-out" aria-label="Éloigner">−</button>
        <button data-action="rotate" aria-label="Tourner">⟳</button>
        <button data-action="resetcam" aria-label="Recentrer">⌖</button>
        <button id="overview" data-action="overview" aria-label="Vue d’ensemble" title="Vue d’ensemble" hidden>↔</button>
      </div>
      <aside id="dock" class="dock"></aside>
    </section>
    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <input id="osm-file" type="file" accept=".osm,.xml,.json" hidden>
  </main>
  <noscript>Activez JavaScript pour jouer à Dernière Sirène.</noscript>
  <script defer src="./game.js"></script>
</body>
</html>
