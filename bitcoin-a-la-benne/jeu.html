<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14112b">
<title>Bitcoin à la Benne</title>
<style>
/* =========================================================
   STYLES
   ========================================================= */
:root{
  --bg:#14112b;--bg2:#1c1840;--card:#252050;--card2:#2f2962;--line:#3c357a;
  --ink:#f4f2ff;--mut:#aaa4d8;--acc:#ffcf3a;--ok:#3ee08f;--bad:#ff5d6c;
  --c-c:#c3c8d4;--c-r:#4da3ff;--c-e:#c07bff;--c-l:#ffb820;
  --as:1; /* multiplicateur de durée des animations (paramètres) */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}

/* ---------- Structure générale ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:620px;margin:0 auto;
  background:radial-gradient(130% 50% at 50% 0%,#2b2468 0%,var(--bg) 70%)}
header{padding:calc(8px + env(safe-area-inset-top)) 12px 6px;display:flex;align-items:center;gap:10px}
.money{flex:1;min-width:0}
.money b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money small{color:var(--mut);font-size:12.5px}
.iconbtn{width:46px;height:46px;border-radius:14px;background:var(--card);font-size:22px;flex:none}
#goal{margin:0 12px 6px;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px}
#goal .ch{color:var(--acc);font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
#goal .obj{margin:2px 0 4px;line-height:1.3}
#goal .gq{color:var(--mut);font-size:12.5px;margin-top:5px;cursor:pointer}
#goal .gq b{color:var(--ink);font-weight:600}
.pbar{height:8px;border-radius:6px;background:#0e0b22;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb820,#ffe27a);border-radius:6px;transition:width .2s}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 18px}
nav{display:grid;grid-template-columns:repeat(8,1fr);background:#0f0c25;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:9.5px;color:var(--mut);position:relative;padding:0 1px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--acc);background:linear-gradient(180deg,#2a2460,transparent)}
nav button .dot{position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--bad)}
h2{font-size:19px;margin:8px 0 10px}
h3{font-size:14px;color:var(--mut);margin:14px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;font-weight:600;font-size:14px}
.btn.prim{background:linear-gradient(180deg,#ffd84f,#f0a800);color:#2a1c00;border:0}
.btn.ok{background:linear-gradient(180deg,#4ff0a0,#1fb86a);color:#022814;border:0}
.btn.bad{background:linear-gradient(180deg,#ff7a86,#e0384a);color:#fff;border:0}
.btn.sm{min-height:40px;padding:6px 10px;font-size:13px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.seg button.on{background:var(--acc);color:#2a1c00;border-color:var(--acc)}
.r-c{color:var(--c-c)}.r-r{color:var(--c-r)}.r-e{color:var(--c-e)}.r-l{color:var(--c-l)}

/* ---------- Onglet Fouille ---------- */
.zones{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zchip{flex:none;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;min-height:40px}
.zchip.on{background:var(--acc);color:#2a1c00;border-color:var(--acc)}
.scene{position:relative;height:200px;border-radius:20px;overflow:hidden;border:1px solid var(--line);cursor:pointer;touch-action:manipulation}
.scene .zname{position:absolute;left:12px;top:10px;font-weight:700;font-size:14px;text-shadow:0 1px 3px #000a;z-index:2}
.scene .deco{position:absolute;inset:auto 0 0 0;height:60px;font-size:30px;display:flex;justify-content:space-around;align-items:flex-end;opacity:.55;padding-bottom:4px}
.pile{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:96px;line-height:1;filter:drop-shadow(0 8px 8px #0008)}
.pile.shake{animation:shake calc(var(--as)*180ms) ease}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-54%,-49%) rotate(-4deg)}75%{transform:translate(-46%,-51%) rotate(4deg)}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.deb{position:absolute;font-size:20px;animation:deb calc(var(--as)*650ms) ease-out forwards}
@keyframes deb{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,0);text-align:center;font-weight:800;white-space:nowrap;
  animation:pop calc(var(--as)*1300ms) ease-out forwards;text-shadow:0 2px 4px #000c}
.pop .e{font-size:42px;display:block}
.pop .n{font-size:14px}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.5);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
.flash{position:absolute;inset:0;animation:flash calc(var(--as)*900ms) ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.dig{width:100%;min-height:68px;margin:10px 0 8px;border-radius:18px;font-size:22px;font-weight:900;letter-spacing:.04em;
  background:linear-gradient(180deg,#ffd84f,#f09a00);color:#2a1700;box-shadow:0 5px 0 #a86400,0 8px 18px #0006}
.dig:active{transform:translateY(4px);box-shadow:0 1px 0 #a86400}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px}
.stats4 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 9px}
.stats4 b{display:block;font-size:15px}
.buffs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.buff{background:#3a2e10;border:1px solid #806018;color:#ffe08a;border-radius:999px;padding:4px 10px;font-size:12px}
.buff.neg{background:#3a1018;border-color:#802030;color:#ffb0b8}
.find{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--card);margin-bottom:5px;font-size:13px}
.find .e{font-size:20px}
.next{border:1px dashed var(--acc);background:#2a2440}

/* ---------- Listes (boutique, employés, inventaire) ---------- */
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
.item .ic{font-size:32px;width:44px;text-align:center;flex:none}
.item .t{font-weight:700;font-size:15px}
.item .d{color:var(--mut);font-size:12.5px;line-height:1.3}
.item .buy{min-width:96px;text-align:center}
.item .buy small{display:block;font-size:11px;font-weight:500;opacity:.85}
.item.locked{opacity:.5}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:#0e0b22;margin-left:4px;vertical-align:2px}
.inv{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px;margin-bottom:6px;border-left:4px solid var(--c-c)}
.inv .ic{font-size:26px;width:34px;text-align:center}
.inv .nm{font-weight:600;font-size:14px}
.inv .d{font-size:12px;color:var(--mut)}
.inv .btn{min-width:56px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{flex:1;min-width:90px;min-height:42px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.tg.on{background:#1f5a3c;border-color:var(--ok);color:#c9ffe1}

/* ---------- Marché ---------- */
.price{font-size:30px;font-weight:800}
.chg{font-weight:700;font-size:14px}
canvas#chart{width:100%;height:170px;display:block;border-radius:14px;background:#0f0c25;border:1px solid var(--line);margin:8px 0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}

/* ---------- Quêtes / Succès / Stats ---------- */
.q{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--card);margin-bottom:6px;font-size:13.5px}
.q.done{opacity:.55}
.q.cur{border:1px solid var(--acc);background:#2e2850}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;color:var(--mut)}
.ach div b{display:block;color:var(--ink);font-size:13.5px;margin:2px 0}
.ach div .e{font-size:26px}
.ach div.lock{filter:grayscale(1);opacity:.45}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.st td:last-child{text-align:right;font-weight:700}

/* ---------- Écran titre ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 70% at 50% 10%,#3b2f8a 0%,#14112b 70%);text-align:center}
#title .logo{font-size:84px;filter:drop-shadow(0 10px 14px #0009);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
#title h1{font-size:40px;line-height:1;margin:10px 0 4px;font-weight:900;letter-spacing:-.02em}
#title h1 span{color:var(--acc);display:block}
#title p{color:var(--mut);margin:6px 0 26px;max-width:320px}
#title .btn{width:min(300px,100%);margin:6px 0;min-height:54px;font-size:17px}

/* ---------- Fenêtres (dialogues, événements…) ---------- */
#modal{position:fixed;inset:0;z-index:60;background:#05031099;display:flex;align-items:flex-end;justify-content:center;padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#modal .box{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:16px;
  animation:up calc(var(--as)*250ms) ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#modal h2{margin-top:0}
.who{display:flex;gap:12px;align-items:flex-start;min-height:90px}
.who .av{font-size:46px;flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:16px}
.who .nm{font-weight:800;color:var(--acc);font-size:14px}
.who .tx{font-size:16px;line-height:1.4;margin-top:2px}
.choices{display:grid;gap:8px;margin-top:12px}
.choices .btn{text-align:left;min-height:52px}
textarea{width:100%;min-height:110px;background:#0e0b22;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}

/* ---------- Notifications ---------- */
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:80;width:min(94vw,520px);pointer-events:none;display:flex;flex-direction:column;gap:6px}
.toast{background:#262052f0;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14px;font-weight:600;box-shadow:0 6px 18px #0008;
  animation:tin calc(var(--as)*250ms) ease-out}
.toast.gold{border-color:var(--c-l);color:#ffe7a8}
.toast.good{border-color:var(--ok)}
.toast.badt{border-color:var(--bad)}
@keyframes tin{from{transform:translateY(-16px);opacity:0}}
.toast.out{transition:opacity calc(var(--as)*300ms);opacity:0}

/* ---------- Bandeau de nouveau chapitre ---------- */
#chapter{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;pointer-events:none}
#chapter div{background:linear-gradient(90deg,transparent,#000c 15%,#000c 85%,transparent);width:100%;text-align:center;padding:26px 10px;
  animation:chap calc(var(--as)*2600ms) ease forwards}
#chapter small{color:var(--acc);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
#chapter b{display:block;font-size:28px;margin-top:6px}
@keyframes chap{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
.money-bump{animation:bump calc(var(--as)*300ms) ease}
@keyframes bump{50%{transform:scale(1.07)}}
@media (min-width:420px){nav button{font-size:11px}}
</style>
</head>

<script>
"use strict";
/* =========================================================
   1. OUTILS GÉNÉRAUX
   ========================================================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function gauss(){ let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** Formate un nombre à la française : 12,5 / 1,5 K / 2,3 M / 4,1 B … */
const UNITS = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n);
  let s, u = '';
  if(n < 1000){
    s = (n < 10 && n % 1 > 0.05) ? n.toFixed(1) : String(Math.floor(n));
  } else {
    let i = -1;
    while(n >= 999.95 && i < UNITS.length - 1){ n /= 1000; i++; }
    s = n < 100 ? n.toFixed(1) : String(Math.floor(n));
    u = ' ' + UNITS[i];
  }
  s = s.replace('.', ',').replace(/,0$/, '');
  return (neg ? '-' : '') + s + u;
}
const eur = n => fmt(n) + ' €';
function fmtBtc(n){ return (n >= 100 ? n.toFixed(2) : n >= 1 ? n.toFixed(4) : n.toFixed(6)).replace('.', ',') + ' ₿'; }
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if(h) return h + ' h ' + String(m).padStart(2, '0') + ' min';
  if(m) return m + ' min ' + String(s).padStart(2, '0') + ' s';
  return s + ' s';
}

/* =========================================================
   2. DONNÉES DU JEU
   ========================================================= */
/** Raretés : poids de tirage (avant chance) et multiplicateur de valeur */
const RAR = {

const RKEYS = ['c','r','e','l'];

/** Zones de la décharge : coût, dureté (points de fouille par objet), valeur de base */
const ZONES = [
  {n:'Le Parking des Bennes', e:'🗑️', cost:0, h:5, v:1, bg:['#3a4a6a','#1b2238'], deco:'🚛🗑️🛢️🗑️',
   items:[['🥫','Canette écrasée','c'],['🧦','Chaussette orpheline','c'],['🥛','Pot de yaourt vide','c'],['📰','Journal mouillé','c'],
          ['⌚','Montre en plastique','r'],['📼','Cassette VHS de mariage','r'],['🎮','Console portable sans piles','e'],['💾','Disquette « NE PAS JETER »','l']]},
  {n:'La Colline des Sacs', e:'🛍️', cost:1e4, h:20, v:6, bg:['#4a6a3a','#1d2b18'], deco:'🛍️🐀🛍️🦟',
   items:[['🥙','Reste de kebab (vintage)','c'],['🍞','Grille-pain fatigué','c'],['🧸','Peluche borgne','c'],['🍾','Bouteille consignée','c'],
          ['📿','Collier fantaisie','r'],['🛴','Trottinette pliée','r'],['🦸','Figurine de collection','e'],['🍫','Lingot d\'or (en chocolat)','l']]},
  {n:'Le Cimetière Électronique', e:'🖥️', cost:1.5e6, h:80, v:36, bg:['#2a4a6a','#0f1c2b'], deco:'📺🔌🖨️📠',
   items:[['🔌','Câble emmêlé','c'],['⌨️','Clavier sans touche Entrée','c'],['🖱️','Souris à boule','c'],['📺','Écran cathodique','c'],
          ['🎞️','Carte graphique grillée','r'],['📱','Téléphone à clapet','r'],['☎️','Minitel en état de marche','e'],['📞','Téléphone indestructible','l']]},

   items:[['🛢️','Bidon suspect','c'],['🦆','Canard fluo','c'],['👢','Botte orpheline','c'],['🐟','Poisson à trois yeux','c'],
          ['🦄','Bouée licorne','r'],['🛵','Moteur de mobylette','r'],['🔒','Coffre-fort rouillé','e'],['🐠','Poisson rouge immortel','l']]},

/** Description lisible d'un outil (par niveau) */
function toolDesc(t){
  const pc = x => '+' + Math.round(x * 100) + ' %', f = t.fx, out = [];
  if(f.tap) out.push('+' + f.tap + ' force par toucher');
  if(f.all) out.push(pc(f.all) + ' force (toucher et équipe)');
  if(f.emp) out.push(pc(f.emp) + ' vitesse de l\'équipe');
  if(f.luck) out.push(pc(f.luck) + ' chance d\'objets rares');
  if(f.val) out.push(pc(f.val) + ' valeur des objets');
  if(f.gant) out.push('chaque toucher ajoute ' + pc(f.gant) + ' de la force/s de l\'équipe');
  return out.join(', ') + ' (par niveau)';
}

/* =========================================================

   ========================================================= */
const lvl = id => S.tools[id] || 0;
const cnt = id => S.emps[id] || 0;
const totalEmps = () => EMPS.reduce((a, e) => a + cnt(e.id), 0);
const depthM = () => Math.min(100, S.depth / CFG.depth * 100);
const costOf = (base, owned, n = 1) => base * Math.pow(COST_GROWTH, owned) * (Math.pow(COST_GROWTH, n) - 1) / (COST_GROWTH - 1);
function maxAfford(base, owned){
  const n = Math.floor(Math.log(S.money * (COST_GROWTH - 1) / (base * Math.pow(COST_GROWTH, owned)) + 1) / Math.log(COST_GROWTH));
  return Math.max(0, n);
}
/** Produit des bonus temporaires d'un type ('emp', 'tap', 'money', 'luck') */
function bm(k){ let m = 1; for(const b of S.buffs) if(b.k === k) m *= b.m; return m; }
function milestoneMult(n){ let m = 1; for(const x of MILESTONES) if(n >= x) m *= 2; return m; }
const karmaMult = () => 1 + 0.10 * S.meta.karma;
function empDps(noBuff){
  let d = 0;
  for(const e of EMPS) d += cnt(e.id) * e.dps * milestoneMult(cnt(e.id));
  d *= (1 + fxSum('emp')) * (1 + fxSum('all'));
  return noBuff ? d : d * bm('emp');
}
function tapPower(){
  return (1 + fxSum('tap') + empDps(true) * fxSum('gant')) * (1 + fxSum('all')) * bm('tap');
}
function luck(){ return (1 + fxSum('luck')) * bm('luck'); }
/** Vitrine : chaque légendaire différent gardé = +10 %, chaque épique différent = +3 % */
function vitrineCount(r){ let n = 0; for(const id in S.inv) if(S.inv[id] > 0 && ITEMS[id].r === r) n++; return n; }
const vitrineBonus = () => 0.10 * vitrineCount('l') + 0.03 * vitrineCount('e');
function valueMult(){
  return (1 + fxSum('val')) * (1 + vitrineBonus()) * karmaMult() * bm('money');
}
const itemValue = id => { const it = ITEMS[id]; return ZONES[it.z].v * RAR[it.r].m * it.f * valueMult(); };
function weights(){
  const L = luck();
  return RKEYS.map(r => RAR[r].w * (RAR[r].lk ? L : 1));
}
/** Valeur moyenne d'un objet trouvé dans la zone z */
function expValue(z){
  const w = weights(), tot = w.reduce((a, b) => a + b, 0);
  let v = 0; RKEYS.forEach((r, i) => v += w[i] / tot * RAR[r].m);
  return v * ZONES[z].v * valueMult();
}
const empFindsPerSec = () => empDps() / ZONES[S.zone].h;
/** Estimation du revenu par seconde (équipe + ~2 touchers/s) pour l'affichage et les récompenses */
function incomeEst(){ return (empDps() + tapPower() * 2) / ZONES[S.zone].h * expValue(S.zone); }
const rewardScale = sec => Math.max(incomeEst() * sec, 0);

/* =========================================================
   5. ACTIONS DU JOUEUR
   ========================================================= */
function earn(x){ if(x <= 0) return; S.money += x; S.st.earned += x; S.meta.life.earned += x; }
function spend(x){ if(S.money < x - 1e-9) return false; S.money = Math.max(0, S.money - x); return true; }

/** Tire une rareté selon la chance */
function rollRarity(){
  const w = weights(); let t = Math.random() * w.reduce((a, b) => a + b, 0);
  for(let i = 0; i < 4; i++){ t -= w[i]; if(t <= 0) return RKEYS[i]; }
  return 'c';
}
/** Ajoute des objets trouvés (avec vente automatique si activée). Renvoie la quantité gardée. */
function addItem(id, n){
  const it = ITEMS[id];
  S.st.finds += n; S.meta.life.finds += n;
  if(it.r === 'r') S.st.rares += n;
  if(it.r === 'e') S.st.epics += n;
  if(it.r === 'l') S.st.legs += n;
  let keep = n;
  const auto = it.r === 'c' ? S.autoSell.c : it.r === 'r' ? S.autoSell.r : S.autoSell.e;
  if(auto){
    // pour épiques/légendaires : on garde toujours un exemplaire pour la vitrine
    keep = (it.r === 'e' || it.r === 'l') ? ((S.inv[id] || 0) > 0 ? 0 : 1) : 0;
    const sold = n - keep;
    if(sold > 0){ earn(itemValue(id) * sold); S.st.sold += sold; }
  }
  if(keep > 0) S.inv[id] = (S.inv[id] || 0) + keep;
  return keep;
}
/** n objets trouvés dans la zone actuelle. Renvoie le meilleur objet (pour l'affichage). */
function gainFinds(n){
  if(n <= 0) return null;
  const z = ZONES[S.zone];
  let best = null; const order = {c:0, r:1, e:2, l:3};
  const note = id => { if(!best || order[ITEMS[id].r] > order[ITEMS[best].r]) best = id; };
  if(n <= 25){
    for(let i = 0; i < n; i++){ const id = pick(z.byR[rollRarity()]); addItem(id, 1); note(id); }
  } else {
    // beaucoup d'objets d'un coup : on répartit selon les probabilités (arrondi aléatoire)
    const w = weights(), tot = w.reduce((a, b) => a + b, 0);
    RKEYS.forEach((r, i) => {
      const exp = n * w[i] / tot; let k = Math.floor(exp); if(Math.random() < exp - k) k++;
      if(k <= 0) return;
      const ids = z.byR[r];
      const parts = Math.min(k, ids.length);
      for(let p = 0; p < parts; p++){
        const q = p === parts - 1 ? k - Math.floor(k / parts) * (parts - 1) : Math.floor(k / parts);
        if(q > 0){ addItem(ids[p], q); note(ids[p]); }
      }
    });
  }
  // Chapitre 3 : le boîtier du disque (zones Cimetière et plus loin)
  if(S.chapter === 2 && !S.storyItem && S.zone >= 2){
    S.storyFinds += n;
    if(S.storyFinds >= CFG.pity || Math.random() < 1 - Math.pow(1 - CFG.chance, Math.min(n, 500))){
      S.storyItem = true;
      UI.storyFound();
    }
  }
  // Chapitre 5 : profondeur dans la Fosse
  if(S.chapter === 4 && S.zone === 6) S.depth = Math.min(CFG.depth, S.depth + n);
  if(best && ITEMS[best].r === 'l') UI.toast('🏆 Légendaire trouvé : ' + ITEMS[best].e + ' ' + ITEMS[best].n, 'gold');
  return best;
}
/** Un toucher sur FOUILLER */
function tap(){
  S.st.taps++; S.meta.life.taps++;
  let p = tapPower(); const crit = Math.random() < 0.05;
  if(crit) p *= 3;
  S.progress += p;
  const h = ZONES[S.zone].h;
  let found = null, n = 0;
  if(S.progress >= h){ n = Math.floor(S.progress / h); S.progress -= n * h; found = gainFinds(n); }
  return {found, n, crit};
}
function sellItem(id, n){
  const have = S.inv[id] || 0; n = Math.min(n, have);
  if(n <= 0) return 0;
  const v = itemValue(id) * n;   // valeur calculée avant de retirer (vitrine incluse)
  S.inv[id] = have - n; if(S.inv[id] <= 0) delete S.inv[id];
  earn(v); S.st.sold += n;
  return v;
}
/** mode 'all' : tout sauf 1 exemplaire des épiques/légendaires ; 'c' : seulement les communs ; 'everything' */
function sellBulk(mode){
  let tot = 0;
  for(const id of Object.keys(S.inv)){
    const r = ITEMS[id].r, have = S.inv[id];
    if(mode === 'c' && r !== 'c') continue;
    const keep = (mode === 'all' && (r === 'e' || r === 'l')) ? 1 : 0;
    if(have - keep > 0) tot += sellItem(id, have - keep);
  }
  return tot;
}
function buyTool(id, n){
  const t = TOOLS.find(x => x.id === id); if(!t || t.z >= S.zones) return false;
  n = Math.min(n, t.max - lvl(id));
  const c = costOf(t.base, lvl(id), n);
  if(n <= 0 || !spend(c)) return false;
  S.tools[id] = lvl(id) + n; return true;
}
function hire(id, n){
  const e = EMPS.find(x => x.id === id); if(!e || e.z >= S.zones) return false;
  const before = cnt(id), c = costOf(e.base, before, n);
  if(n <= 0 || !spend(c)) return false;
  S.emps[id] = before + n;
  for(const m of MILESTONES) if(before < m && before + n >= m) UI.toast('⚡ ' + e.n + ' : ' + m + ' embauchés, production x2 !', 'good');
  return true;
}
function unlockZone(){
  if(S.zones >= ZONES.length) return false;

}

/* ----- Marché crypto ----- */
const FEE = 0.01;
function marketBuy(frac){
  const amount = S.money * frac; if(amount < 0.01) return 0;
  spend(amount);
  S.btc += amount * (1 - FEE) / S.market.p; S.btcCost += amount; S.st.buys++;
  return amount;
}
function marketSell(frac){
  if(S.btc <= 0) return null;
  const q = frac >= 1 ? S.btc : S.btc * frac;
  const proceeds = q * S.market.p * (1 - FEE);
  const costPart = S.btcCost * (q / S.btc);
  const profit = proceeds - costPart;
  S.btc -= q; S.btcCost -= costPart;
  if(S.btc < 1e-12){ S.btc = 0; S.btcCost = 0; }
  // le capital revient en caisse, seul le bénéfice compte comme « argent gagné »
  S.money += Math.min(proceeds, costPart); if(profit > 0) earn(profit);
  S.st.sells++;
  if(profit > S.st.bestTrade) S.st.bestTrade = profit;
  if(profit < S.st.worstTrade) S.st.worstTrade = profit;
  if(profit > S.meta.life.bestTrade) S.meta.life.bestTrade = profit;
  return profit;
}
function marketStep(){
  const m = S.market;
  m.target *= Math.exp(0.004 * gauss());
  m.target = clamp(m.target, 12000, 90000);
  let lp = Math.log(m.p);
  lp += 0.03 * (Math.log(m.target) - lp) + 0.012 * gauss();
  if(Math.random() < 0.008) lp += (Math.random() < 0.5 ? -1 : 1) * rand(0.06, 0.16);   // pump ou krach
  m.p = clamp(Math.exp(lp), 3000, 300000);
  m.hist.push(m.p); if(m.hist.length > 90) m.hist.shift();
}
function marketShock(pct){ S.market.p *= (1 + pct); S.market.hist[S.market.hist.length - 1] = S.market.p; }

   ========================================================= */
function checkProgress(){
  // quête en cours
  let guard = 0;
  while(S.quest < QUESTS.length - 1 && QUESTS[S.quest].c() && guard++ < 5){
    const q = QUESTS[S.quest]; const x = Math.max(q.r[1], R(q.r[0]) * (q.r[0] ? 1 : 0));
    earn(x); S.quest++;
    UI.toast('📜 Quête terminée : ' + q.t + ' (+' + eur(x) + ')', 'good'); UI.sfx('buy');
  }
  // succès
  for(const a of ACHS){
    if(!S.meta.ach[a.id] && a.c()){ S.meta.ach[a.id] = true; UI.toast('🏅 Succès : ' + a.n, 'gold'); UI.sfx('rare'); UI.dot('ach'); }
  }
  // chapitres
  if(!S.ended && CHAPTERS[S.chapter].done()){
    const ch = CHAPTERS[S.chapter];
    S.chapterTimes.push(S.st.time);
    if(S.chapter < CHAPTERS.length - 1){
      S.chapter++;
      UI.queue({type:'dialog', lines:ch.dlg, after:()=>UI.chapterBanner(S.chapter)});
    } else {
      S.ended = true; S.endTime = S.st.time; S.meta.finishes++;
      if(!S.meta.bestTime || S.endTime < S.meta.bestTime) S.meta.bestTime = S.endTime;
      if(S.quest === QUESTS.length - 1) S.quest = QUESTS.length;
      UI.queue({type:'dialog', lines:END_DLG, after:()=>UI.queue({type:'end'})});
      checkProgress();
    }
  }
}

/* =========================================================
   8. BOUCLE DE JEU (tick)
   ========================================================= */
function tick(dt){
  S.st.time += dt; S.meta.life.time += dt;
  // fin des bonus temporaires
  S.buffs = S.buffs.filter(b => b.until > S.st.time);
  // l'équipe fouille
  const pts = empDps() * dt;
  if(pts > 0){
    const f = pts / ZONES[S.zone].h + S.empAcc;
    const n = Math.floor(f); S.empAcc = f - n;
    if(n > 0) gainFinds(n);
  }
  // marché : une nouvelle cotation par seconde
  S.market.acc += dt;
  let steps = 0;
  while(S.market.acc >= 1 && steps++ < 120){ S.market.acc -= 1; marketStep(); }
  if(S.market.acc > 1) S.market.acc = 0;
  // événements aléatoires
  if(S.st.time >= S.nextEvent){
    S.nextEvent = S.st.time + rand(80, 150);
    if(!UI.busy()) triggerEvent();
  }
  checkProgress();
}
/** Gains hors ligne : 50 % de ce que l'équipe aurait trouvé (max 8 h) */
function applyOffline(sec){
  sec = Math.min(sec, 8 * 3600);
  const fps = empDps(true) / ZONES[S.zone].h;
  if(sec < 30 || fps <= 0) return null;
  const finds = fps * sec * 0.5;
  const money = finds * expValue(S.zone) / bm('money');
  earn(money);
  S.st.finds += Math.floor(finds); S.meta.life.finds += Math.floor(finds);
  if(S.chapter === 2 && !S.storyItem && S.zone >= 2) S.storyFinds += Math.floor(finds);
  if(S.chapter === 4 && S.zone === 6) S.depth = Math.min(CFG.depth, S.depth + Math.floor(finds));
  // le marché a aussi bougé
  for(let i = 0; i < Math.min(90, sec); i++) marketStep();
  return {sec, money, finds};
}

function merge(def, obj){
  if(obj === null || typeof obj !== 'object' || Array.isArray(def) || typeof def !== 'object' || def === null) return obj === undefined ? def : obj;
  const out = {...def};
  for(const k in obj) out[k] = (k in def) ? merge(def[k], obj[k]) : obj[k];
  return out;
}
function save(){
  if(!S || HEADLESS) return;

function parseSave(txt){
  const o = JSON.parse(txt);
  if(!o || typeof o !== 'object' || o.v !== 1 || typeof o.money !== 'number') throw new Error('format');
  const def = newState();
  const st = merge(def, o);
  st.meta = merge(defaultMeta(), o.meta || {});
  if(!Array.isArray(st.market.hist) || !st.market.hist.length) st.market.hist = def.market.hist;
  return st;
}

}

const AUD = {ctx:null, master:null, music:null, sfxGain:null, timer:null, nextT:0, step:0};
function audioInit(){
  if(AUD.ctx){ if(AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  AUD.ctx = new AC();
  AUD.master = AUD.ctx.createGain(); AUD.master.gain.value = 0.8; AUD.master.connect(AUD.ctx.destination);
  AUD.sfxGain = AUD.ctx.createGain(); AUD.sfxGain.gain.value = 0.5; AUD.sfxGain.connect(AUD.master);
  AUD.music = AUD.ctx.createGain(); AUD.music.gain.value = 0; AUD.music.connect(AUD.master);
  musicUpdate();
}
function note(freq, t, dur, type, vol, dest, slide){
  const c = AUD.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || AUD.sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function sfx(name){
  if(HEADLESS || !AUD.ctx || !S || !S.meta.settings.sound) return;
  const t = AUD.ctx.currentTime;
  switch(name){
    case 'click': note(rand(500, 620), t, 0.05, 'square', 0.08, null, 300); break;
    case 'dig':   note(rand(140, 190), t, 0.08, 'triangle', 0.18, null, 70); break;
    case 'find':  note(660, t, 0.08, 'triangle', 0.2); note(990, t + 0.06, 0.1, 'triangle', 0.18); break;
    case 'rare':  [72, 76, 79, 84].forEach((m, i) => note(mtof(m), t + i * 0.06, 0.18, 'square', 0.09)); break;
    case 'epic':  [67, 71, 74, 79, 83].forEach((m, i) => note(mtof(m), t + i * 0.07, 0.25, 'sawtooth', 0.07)); break;
    case 'leg':   [72, 76, 79, 84, 88, 91].forEach((m, i) => { note(mtof(m), t + i * 0.08, 0.4, 'square', 0.08); note(mtof(m + 12), t + i * 0.08, 0.3, 'sine', 0.06); }); break;
    case 'buy':   note(1200, t, 0.06, 'square', 0.08); note(1800, t + 0.05, 0.12, 'square', 0.07); break;
    case 'sell':  note(880, t, 0.05, 'triangle', 0.15); note(1320, t + 0.04, 0.08, 'triangle', 0.12); break;
    case 'error': note(180, t, 0.18, 'sawtooth', 0.1, null, 120); break;
    case 'event': note(440, t, 0.15, 'square', 0.08); note(330, t + 0.15, 0.2, 'square', 0.08); break;
    case 'chapter': [60, 64, 67, 72, 67, 72, 76].forEach((m, i) => note(mtof(m), t + i * 0.12, 0.35, 'square', 0.08)); break;
  }
}
/* Musique d'ambiance : petite boucle Lam - Fa - Do - Sol, générée en direct */
const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const PENTA = [69, 72, 74, 76, 79, 81];
function musicUpdate(){
  if(!AUD.ctx) return;
  const on = (S ? S.meta : titleMeta).settings.music;
  AUD.music.gain.setTargetAtTime(on ? 0.055 : 0, AUD.ctx.currentTime, 0.3);
  if(on && !AUD.timer){ AUD.nextT = AUD.ctx.currentTime + 0.1; AUD.timer = setInterval(musicSched, 60); }
  if(!on && AUD.timer){ clearInterval(AUD.timer); AUD.timer = null; }
}
function musicSched(){
  const c = AUD.ctx, beat = 60 / 88 / 2;   // croches à 88 bpm
  while(AUD.nextT < c.currentTime + 0.25){
    const t = AUD.nextT, s = AUD.step, bar = Math.floor(s / 8) % 4, chord = PROG[bar];
    if(s % 8 === 0) chord.forEach(m => note(mtof(m), t, beat * 7.5, 'triangle', 0.22, AUD.music));
    if(s % 4 === 0) note(mtof(chord[0] - 12), t, beat * 1.8, 'sine', 0.5, AUD.music);
    if(s % 2 === 1 && Math.random() < 0.3) note(mtof(pick(PENTA)), t, beat * 1.5, 'sine', 0.18, AUD.music);
    if(s % 2 === 0) note(4000, t, 0.03, 'square', 0.015, AUD.music);
    AUD.nextT += beat; AUD.step++;
  }
}

/** Petit graphique du cours (canvas) */
function drawChart(){
  const cv = $('#chart'); if(!cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const d = S.market.hist; let mn = Math.min(...d), mx = Math.max(...d); const pad = (mx - mn) * 0.1 || mx * 0.01; mn -= pad; mx += pad;
  const X = i => i / (d.length - 1) * w, Y = v => h - (v - mn) / (mx - mn) * h;
  const up = d[d.length - 1] >= d[0], col = up ? '#3ee08f' : '#ff5d6c';
  g.strokeStyle = '#ffffff12'; g.lineWidth = 1;
  for(let i = 1; i < 4; i++){ g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke(); }
  g.beginPath(); d.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.strokeStyle = col; g.lineWidth = 2; g.stroke();
  g.lineTo(w, h); g.lineTo(0, h); g.closePath();
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, col + '55'); gr.addColorStop(1, col + '00'); g.fillStyle = gr; g.fill();
  if(S.btc > 0){ // prix moyen d'achat
    const avg = S.btcCost / S.btc / (1 - FEE);
    if(avg > mn && avg < mx){ g.setLineDash([5, 4]); g.strokeStyle = '#ffcf3a'; g.beginPath(); g.moveTo(0, Y(avg)); g.lineTo(w, Y(avg)); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#ffcf3a'; g.font = '11px system-ui'; g.fillText('votre prix moyen', 6, Y(avg) - 4); }
  }
  g.fillStyle = '#aaa4d8'; g.font = '11px system-ui'; g.fillText(eur(mx), 6, 13); g.fillText(eur(mn), 6, h - 5);
}

function feedbackBuy(ok){ sfx(ok ? 'buy' : 'error'); if(ok) UI.render(); }
const ACTIONS = {
  newgame(){
    const old = loadSave();
    const start = () => {
      const meta = old ? old.meta : (titleMeta || defaultMeta());
      S = newState(meta); startGame(true);
    };
    if(old && !confirm('Commencer une nouvelle partie ? La partie en cours sera remplacée (le Karma et les succès sont gardés).')) return;
    start();
  },
  continue(){
    const s = loadSave(); if(!s) return;
    S = s;
    const away = (Date.now() - S.lastSave) / 1000;   // calculé AVANT la première sauvegarde
    const off = applyOffline(away);
    startGame(false);
    if(off){
      UI.queue({type:'html', html:'<div style="text-align:center"><div style="font-size:56px">🌙</div><h2>Bon retour !</h2><p class="muted">Vous étiez absent ' + fmtTime(off.sec) + '.</p>' +

    }
  },
  settings(){ openSettings(); },
  closemodal(){ UI.closeModal(); },
  tab(el){ UI.setTab(el.dataset.tab); },
  dlgnext(){ const m = UI.cur; if(m.i < m.lines.length - 1){ m.i++; UI.renderDialog(); } else UI.closeModal(); },
  dlgskip(){ UI.closeModal(); },
  evchoice(el){
    const ev = UI.cur.ev, res = resolveEvent(ev, +el.dataset.i);
    $('#mbox').innerHTML = '<h2>' + ev.e + ' ' + esc(ev.t) + '</h2><p style="font-size:16px;line-height:1.45;margin:8px 0 14px">' + esc(res) + '</p><button class="btn prim" style="width:100%" data-act="closemodal">OK</button>';
    UI.render();
  },
  zone(el){ setZone(+el.dataset.z); UI.render(true); },
  unlock(){ const ok = unlockZone(); sfx(ok ? 'chapter' : 'error'); UI.render(true); },
  buyn(el){ const n = el.dataset.n; UI.buyN = n === 'max' ? 'max' : +n; UI.render(true); },
  tool(el){ const t = TOOLS.find(x => x.id === el.dataset.id); feedbackBuy(buyTool(t.id, Math.min(t.max - lvl(t.id), buyCount(t.base, lvl(t.id))))); },
  hire(el){ const e = EMPS.find(x => x.id === el.dataset.id); feedbackBuy(hire(e.id, buyCount(e.base, cnt(e.id)))); },
  sell1(el){ const v = sellItem(el.dataset.id, 1); if(v){ sfx('sell'); UI.bumpMoney(); } UI.render(); },
  sellx(el){ const v = sellItem(el.dataset.id, S.inv[el.dataset.id] || 0); if(v){ sfx('sell'); UI.bumpMoney(); UI.toast('+' + eur(v)); } UI.render(); },
  sellall(){ const v = sellBulk('all'); if(v){ sfx('sell'); UI.bumpMoney(); UI.toast('💶 Vente : +' + eur(v), 'good'); } UI.render(); },
  sellc(){ const v = sellBulk('c'); if(v){ sfx('sell'); UI.bumpMoney(); UI.toast('💶 Vente : +' + eur(v), 'good'); } UI.render(); },
  autosell(el){ const k = el.dataset.k; S.autoSell[k] = !S.autoSell[k];
    // en activant, on vend tout de suite ce qui correspond (en gardant 1 exemplaire des épiques/légendaires)
    if(S.autoSell[k]) for(const id of Object.keys(S.inv)){ const r = ITEMS[id].r;
      if(k === 'c' && r === 'c') sellItem(id, S.inv[id]);

  mbuy(el){ const a = marketBuy(+el.dataset.f); if(a){ sfx('buy'); UI.toast('₿ Achat : ' + eur(a)); } else sfx('error'); UI.render(); },
  msell(el){ const p = marketSell(+el.dataset.f); if(p === null){ sfx('error'); return; }

  prestige(){

/* =========================================================
   15. DÉMARRAGE ET BOUCLE PRINCIPALE
   ========================================================= */
let last = 0, uiAcc = 0, saveAcc = 0, running = false;
function startGame(isNew){
  $('#title').classList.add('hidden'); $('#app').classList.remove('hidden');
  applyAnim(S.meta); musicUpdate();
  UI.buildNav(); UI.setTab('dig');
  if(isNew){
    UI.queue({type:'dialog', lines:INTRO, after:()=>{
      UI.chapterBanner(0);
      if(!S.meta.tuto){ S.meta.tuto = true; UI.queue({type:'dialog', lines:TUTO}); }
    }});
  }
  last = performance.now(); running = true; save();
}
function loop(){
  const now = performance.now(); let dt = (now - last) / 1000; last = now;
  if(!running || !S) return;
  if(dt > 60){ // onglet mis en veille longtemps : on applique les gains hors ligne
    const off = applyOffline(dt); if(off) UI.toast('🌙 Pendant votre absence : +' + eur(off.money), 'good'); dt = 0.1;
  }
  tick(Math.min(dt, 60));
  uiAcc += dt; saveAcc += dt;
  if(uiAcc >= 0.25){ uiAcc = 0; UI.render(); }
  if(saveAcc >= 10){ saveAcc = 0; save(); }
}
setInterval(loop, 100);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); else if(AUD.ctx && AUD.ctx.state === 'suspended' && S) AUD.ctx.resume(); });
window.addEventListener('pagehide', save);

(function initTitle(){
  const s = loadSave();
  $('#btnContinue').disabled = !s;
  let settings = null;
  if(s) settings = s.meta.settings;
  else try{ settings = JSON.parse(localStorage.getItem(SAVE_KEY + '_settings') || 'null'); }catch(e){}
  titleMeta = defaultMeta(); if(settings) titleMeta.settings = {...titleMeta.settings, ...settings};
  if(s) titleMeta = s.meta;
  applyAnim(titleMeta);
})();
