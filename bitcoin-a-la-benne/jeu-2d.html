<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1a14">
<title>Bitcoin à la Benne</title>
<style>
/* =========================================================
   STYLES — le monde est dessiné dans un <canvas>, l'interface en HTML par-dessus
   ========================================================= */
:root{--ink:#fff8ec;--mut:#d8ccb6;--acc:#ffcf3a;--ok:#3ee08f;--bad:#ff5d6c;--panel:#2a2219ee;--panel2:#3a2f22;--line:#5a4a36;
  --c-c:#d9dde4;--c-r:#59b0ff;--c-e:#c98bff;--c-l:#ffc43a;--as:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b1a14;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}
.r-c{color:var(--c-c)}.r-r{color:var(--c-r)}.r-e{color:var(--c-e)}.r-l{color:var(--c-l)}
.muted{color:var(--mut)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;max-width:640px;margin:0 auto}
#hud .top{position:absolute;left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));display:flex;gap:6px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 10px;box-shadow:0 4px 14px #0007;pointer-events:auto}
#money{flex:1;min-width:0}
#money b{font-size:21px;color:var(--acc);font-weight:900;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#money small{font-size:11px;color:var(--mut);white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
#bagBox{width:112px}
#bagBox .l{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.bar{height:8px;border-radius:6px;background:#0007;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7bd88f,#ffd84f);transition:width .2s}
.bar i.full{background:linear-gradient(90deg,#ff8a5c,#ff5d6c)}
.bar.gold i{background:linear-gradient(90deg,#ffb820,#ffe27a)}
#goal{position:absolute;left:8px;right:8px;top:calc(56px + env(safe-area-inset-top));padding:6px 10px;font-size:12.5px;cursor:pointer}
#goal .ch{color:var(--acc);font-weight:800;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
#goal .obj{margin:1px 0 3px;line-height:1.25}
#goal .gq{color:var(--mut);font-size:11.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal .gq b{color:var(--ink);font-weight:600}
#det{position:absolute;right:8px;top:calc(150px + env(safe-area-inset-top));width:108px;text-align:center;font-size:11px}
#det .bars{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:20px;margin:2px 0}
#det .bars i{width:9px;border-radius:3px;background:#0006}
#buffs{position:absolute;left:8px;top:calc(150px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.buff{background:#3a2e10ee;border:1px solid #806018;color:#ffe08a;border-radius:999px;padding:3px 9px;font-size:11.5px}
.buff.neg{background:#3a1018ee;border-color:#802030;color:#ffb0b8}
#bottom{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px}
.big{flex:1;min-height:56px;border-radius:16px;font-weight:800;font-size:13.5px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px #0007;pointer-events:auto;line-height:1.15;padding:0 4px}
.big .i{display:block;font-size:20px}
.big.gold{background:linear-gradient(180deg,#ffd84f,#f0a000);color:#2a1700;border:0}
.big.pulse{animation:pulse calc(var(--as)*0.9s) ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 6px #ffd84f55}}
#bCenter{position:absolute;right:8px;bottom:calc(74px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:14px;font-size:20px;pointer-events:auto;background:var(--panel);border:1px solid var(--line)}
#toasts{position:fixed;top:calc(150px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(70vw,420px);display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:40}
.toast{background:#2a2219f2;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;text-align:center;animation:tin calc(var(--as)*.25s) ease-out}
.toast.gold{border-color:var(--c-l);color:#ffe7a8}.toast.bad{border-color:var(--bad)}.toast.good{border-color:var(--ok)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
.out{transition:opacity .3s;opacity:0}

/* ---------- Panneaux (bas de l'écran) ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#2a2219;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:12px 12px calc(14px + env(safe-area-inset-bottom));height:76vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform calc(var(--as)*.28s) ease;z-index:30;box-shadow:0 -10px 30px #000a}
#sheet.open{transform:none}
#sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sheet .head h2{flex:1;font-size:18px}
#sheetTabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none;flex:none}
#sheetTabs::-webkit-scrollbar{display:none}
#sheetTabs button{flex:none;min-height:40px;padding:0 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13px}
#sheetTabs button.on{background:var(--acc);color:#2a1700;border-color:var(--acc)}
#sheetBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:44px;height:44px;border-radius:12px;background:var(--panel2);font-size:20px;flex:none}
.card{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:9px 10px;margin-bottom:7px}
.card .ic{font-size:28px;width:40px;text-align:center;flex:none}
.card .t{font-weight:800;font-size:14.5px}
.card .d{font-size:12px;color:var(--mut);line-height:1.3}
.card.lock{opacity:.5}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:#0005;margin-left:3px;vertical-align:2px;font-weight:700}
.buy{min-width:92px;min-height:46px;border-radius:12px;font-weight:800;background:linear-gradient(180deg,#ffd84f,#f0a000);color:#2a1700;font-size:13px;line-height:1.15;padding:0 6px;flex:none}
.buy small{display:block;font-weight:600;font-size:11.5px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:46px;font-weight:700;font-size:14px}
.btn.prim{background:linear-gradient(180deg,#ffd84f,#f0a000);color:#2a1c00;border:0}
.btn.ok{background:linear-gradient(180deg,#4ff0a0,#1fb86a);color:#022814;border:0}
.btn.bad{background:linear-gradient(180deg,#ff7a86,#e0384a);color:#fff;border:0}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
h3{font-size:12.5px;color:var(--mut);margin:12px 0 7px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:5px}
canvas#chart{width:100%;height:160px;display:block;border-radius:14px;background:#17130e;border:1px solid var(--line);margin:8px 0}
.price{font-size:28px;font-weight:900}
.colgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.colgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;font-size:10px;color:var(--mut);min-height:70px}
.colgrid div .e{font-size:24px;display:block}
.colgrid div.no{filter:grayscale(1) brightness(.5)}
.colgrid div.vit{border-color:var(--c-l)}
.q{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);margin-bottom:5px;font-size:13px}
.q.done{opacity:.5}.q.cur{border:1px solid var(--acc)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ach div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px;font-size:11.5px;color:var(--mut)}
.ach div b{display:block;color:var(--ink);font-size:13px;margin:2px 0}
.ach div .e{font-size:24px}
.ach div.lock{filter:grayscale(1);opacity:.45}
table.st{width:100%;border-collapse:collapse;font-size:13.5px}
table.st td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.st td:last-child{text-align:right;font-weight:700}
.set{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.seg{display:flex;gap:5px}
.seg button{flex:1;min-height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:12.5px;padding:0 6px}
.seg button.on{background:var(--acc);color:#2a1c00;border-color:var(--acc)}
.tg{min-width:84px;min-height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:12.5px}
.tg.on{background:#1f5a3c;border-color:var(--ok);color:#c9ffe1}
textarea{width:100%;min-height:90px;background:#17130e;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:11px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}

/* ---------- Fenêtres (dialogues, événements, fin…) ---------- */
#modal{position:fixed;inset:0;z-index:60;background:#0a060099;display:flex;align-items:flex-end;justify-content:center;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#mbox{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:#2a2219;border:1px solid var(--line);border-radius:22px;padding:15px;animation:up calc(var(--as)*.25s) ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#mbox h2{font-size:19px;margin-bottom:6px}
.who{display:flex;gap:12px;align-items:flex-start;min-height:88px}
.who .av{font-size:44px;flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:16px}
.who .nm{font-weight:800;color:var(--acc);font-size:14px}
.who .tx{font-size:16px;line-height:1.4;margin-top:2px}
.choices{display:grid;gap:7px;margin-top:10px}
.choices .btn{text-align:left;min-height:50px}

/* ---------- Écran titre ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
  background:radial-gradient(90% 60% at 50% 40%,#1b140caa 0%,#0d0905e8 75%)}
#title .logo{font-size:78px;filter:drop-shadow(0 10px 14px #000a);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-4deg)}}
#title h1{font-size:42px;line-height:.95;margin:8px 0 6px;font-weight:900;letter-spacing:-.02em;text-shadow:0 4px 0 #0008}
#title h1 span{color:var(--acc);display:block}
#title p{color:var(--mut);margin:4px 0 24px;max-width:320px;font-size:15px}
#title .btn{width:min(300px,100%);margin:5px 0;min-height:54px;font-size:17px}

/* ---------- Bandeau de chapitre ---------- */
#chapter{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;pointer-events:none}
#chapter div{background:linear-gradient(90deg,transparent,#000c 15%,#000c 85%,transparent);width:100%;text-align:center;padding:24px 10px;animation:chap calc(var(--as)*2.6s) ease forwards}
#chapter small{color:var(--acc);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
#chapter b{display:block;font-size:27px;margin-top:6px}
@keyframes chap{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="world"></canvas>

<!-- ======================= INTERFACE DE JEU ======================= -->
<div id="hud" class="hidden">
  <div class="top">
    <div class="pill" id="money"><b id="mVal">0 €</b><small id="mSub"></small></div>
    <div class="pill" id="bagBox"><div class="l"><span id="bagLbl">🎒 Sac</span><b id="bagTxt">0/8</b></div><div class="bar"><i id="bagBar"></i></div></div>
  </div>
  <div class="pill" id="goal" data-act="open" data-sheet="menu" data-tab="quests">
    <div class="ch" id="gCh"></div><div class="obj" id="gObj"></div>
    <div class="bar gold"><i id="gBar"></i></div><div class="gq" id="gQuest"></div>
  </div>
  <div class="pill hidden" id="det"><div>📡 Détecteur</div><div class="bars" id="detBars"></div><div id="detTxt">—</div></div>
  <div id="buffs"></div>
  <button id="bCenter" data-act="center" aria-label="Centrer sur Kévin">🎯</button>
  <div id="bottom">
    <button class="big" id="bSell" data-act="sell"><span class="i">🏠</span>Vendre</button>
    <button class="big gold" data-act="open" data-sheet="shop"><span class="i">🛠️</span>Boutique</button>
    <button class="big" data-act="open" data-sheet="market"><span class="i">📈</span>Marché</button>
    <button class="big" data-act="open" data-sheet="menu"><span class="i">☰</span>Menu</button>
  </div>
</div>
<div id="toasts"></div>

<div id="sheet"><div class="head"><h2 id="sheetTitle"></h2><button class="x" data-act="closesheet">✕</button></div>
  <div id="sheetTabs"></div><div id="sheetBody"></div></div>

<!-- ======================= ÉCRAN TITRE ======================= -->
<div id="title">
  <div class="logo">💽</div>

</div>

<div id="modal" class="hidden"><div id="mbox"></div></div>

<script>
"use strict";
/* =========================================================
   1. OUTILS
   ========================================================= */
const $ = s => document.querySelector(s);
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = Math.random, rnd = (a, b) => a + R() * (b - a), clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pick = (a, r = R) => a[Math.floor(r() * a.length)];
function gauss(){ let u = 0, v = 0; while(!u) u = R(); while(!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UNITS = ['K','M','B','T','Qa','Qi','Sx'];
/** Nombres à la française : 12 / 4,5 / 1,5 K / 2,3 M / 4,1 B */
function fmt(n){
  if(!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n); let s, u = '';
  if(n < 1000) s = (n < 10 && n % 1 > 0.05) ? n.toFixed(1) : String(Math.floor(n));
  else { let i = -1; while(n >= 999.95 && i < UNITS.length - 1){ n /= 1000; i++; } s = n < 100 ? n.toFixed(1) : String(Math.floor(n)); u = ' ' + UNITS[i]; }
  return (neg ? '-' : '') + s.replace('.', ',').replace(/,0$/, '') + u;
}
const eur = n => fmt(n) + ' €';
const fmtBtc = n => (n >= 100 ? n.toFixed(2) : n >= 1 ? n.toFixed(4) : n.toFixed(6)).replace('.', ',') + ' ₿';
function fmtTime(sec){ sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + ' h ' + String(m).padStart(2, '0') + ' min' : m ? m + ' min ' + String(s).padStart(2, '0') + ' s' : s + ' s'; }

/* =========================================================

];

   ========================================================= */
const KEV_HIT = 0.6, WORKER_HIT = 1.2;
const totalEmps = () => EMPS.reduce((a, e) => a + (S.emps[e.id] || 0), 0);
const toolPow = () => Math.pow(1.10, S.up.tool);
const teamPow = () => Math.pow(1.05, S.up.team);
const bagCap = () => SACKS[S.up.sac].cap + (S.up.brou ? 15 : 0) + (S.up.digger ? 40 : 0);
const kevSpeed = () => 2.4 * (1 + 0.1 * S.up.boots) * (S.up.brou ? 1.15 : 1);
const kevPower = () => toolPow() * (S.up.digger ? 3 : 1) * bm('tap');
const detRange = () => 6 + 3 * S.up.detR;
function bm(k){ let m = 1; for(const b of S.buffs) if(b.k === k) m *= b.m; return m; }
const luck = () => (1 + 0.05 * S.up.luck) * bm('luck');
function vitCount(r){ let n = 0; for(const k in S.vit){ const [q, i] = k.split('_').map(Number); if(LOOT[q] && LOOT[q][i] && LOOT[q][i][2] === r) n++; } return n; }
const vitBonus = () => 0.10 * vitCount('l') + 0.03 * vitCount('e');
const karmaMult = () => 1 + 0.10 * S.meta.karma;
const valueMult = () => (1 + vitBonus()) * karmaMult() * bm('money');
const itemValue = it => QUARTERS[it[0]].v * RAR[itemOf(it)[2]].m * it[2] * valueMult();
/** Valeur moyenne d'une couche vidée dans le quartier q (1,35 objet par couche) */
function layerValue(q){
  const L = luck(); let tw = 0, v = 0;
  for(const r of RK){ const w = RAR[r].w * (RAR[r].lk ? L : 1); tw += w; v += w * RAR[r].m; }
  return 1.35 * v / tw * QUARTERS[q].v * valueMult();
}
const deepestOpen = () => { let q = 0; S.unlocked.forEach((u, i) => { if(u) q = i; }); return q; };
const avgLayerHp = q => QUARTERS[q].hp * 1.3 * Math.pow(1.15, (QUARTERS[q].L[0] + QUARTERS[q].L[1]) / 4);
/** Revenu par seconde estimé de l'équipe (affichage, gains hors ligne) */
function teamIncome(){
  let inc = 0; const q = deepestOpen();
  for(const e of EMPS) inc += (S.emps[e.id] || 0) * e.pow * teamPow() / WORKER_HIT / avgLayerHp(q) * layerValue(q) * 0.8;
  return inc * bm('emp');
}
const rewardSec = sec => Math.max(0, (teamIncome() + kevPower() / KEV_HIT / avgLayerHp(deepestOpen()) * layerValue(deepestOpen())) * sec);

function genWorld(seed){
  const rng = mulberry(seed); tiles = [];
  for(let r = 0; r < ROWS; r++){
    const row = [];

/* =========================================================
   9. ENTITÉS : Kévin, employés, camion, effets
   ========================================================= */
const tx = c => c * T + T / 2, ty = r => r * T + T / 2;
let kevin = null, truck = null, workers = [];
const parts = [], pops = [], gulls = [];
function mkEnt(c, r){ return {x:tx(c), y:ty(r), c, r, path:[], face:1, walk:0, dig:0, target:null, after:null, bubble:null, bubbleT:0, cd:0}; }
function resetEntities(){
  const k = S.kev && walkable(S.kev.c, S.kev.r) ? S.kev : START;
  kevin = mkEnt(k.c, k.r); kevin.autoT = undefined; kevin.prefQ = 0; kevin.goal = null;
  workers = []; for(const e of EMPS) for(let i = 0; i < (S.emps[e.id] || 0); i++) addWorkerEnt(e.id, true);
  truck = {...mkEnt(TRUCK_HOME.c, TRUCK_HOME.r), state:'home', load:[], ang:Math.PI / 2, wait:0};
  parts.length = 0; pops.length = 0;
}
function say(ent, txt, sec){ if(HEADLESS) return; ent.bubble = txt; ent.bubbleT = sec || 2.5; }
function goTo(ent, path, then){ ent.path = path ? path.slice(1) : []; ent.after = then; ent.target = null; if(!ent.path.length && then){ ent.after = null; then(); } }
function moveEnt(ent, dt, speed){
  if(!ent.path.length) return false;
  const [c, r] = ent.path[0];
  if(!walkable(c, r)){ ent.path = []; ent.after = null; return false; }    // chemin bloqué (des ordures sont revenues)
  const gx = tx(c), gy = ty(r), dx = gx - ent.x, dy = gy - ent.y, d = Math.hypot(dx, dy), st = speed * T * dt;
  if(Math.abs(dx) > 1) ent.face = dx > 0 ? 1 : -1;
  if(d > 0.5) ent.ang = Math.atan2(dy, dx);
  ent.walk += dt * 11;
  if(d <= st){ ent.x = gx; ent.y = gy; ent.c = c; ent.r = r; ent.path.shift();
    if(!ent.path.length && ent.after){ const f = ent.after; ent.after = null; f(); } }
  else { ent.x += dx / d * st; ent.y += dy / d * st; }
  return true;
}
/** Kévin va vider le tas (c, r) */
function orderDig(c, r, quiet){
  const t = tile(c, r); if(!t || !t.L) return false;
  kevin.prefQ = t.q; kevin.autoT = undefined;
  if(!kevin.path.length && adjacentOK(kevin.c, kevin.r, c, r)){ kevin.target = {c, r}; kevin.goal = null; return true; }
  const path = findPath(kevin.c, kevin.r, (pc, pr) => adjacentOK(pc, pr, c, r));
  if(!path){ if(!quiet){ UI.toast('🚧 Pas d\'accès : videz d\'abord les tas devant.', 'bad'); sfx('error'); } return false; }
  kevin.goal = {c, r};
  goTo(kevin, path, () => { kevin.target = {c, r}; kevin.goal = null; });
  return true;
}
function orderSell(){
  if(!S.bag.length){ UI.toast('Le sac est vide.'); return false; }
  const path = findPath(kevin.c, kevin.r, (c, r) => c === SELL_TILE.c && r === SELL_TILE.r);
  if(!path){ UI.toast('🚧 Chemin bloqué vers la cabane.', 'bad'); return false; }
  const back = kevin.target ? {...kevin.target} : kevin.goal ? {...kevin.goal} : null;
  kevin.autoT = undefined;
  goTo(kevin, path, () => { sellBag(S.bag, SELL_TILE); S.bag = []; S.st.trips++; if(!back || !orderDig(back.c, back.r, true)) kevin.autoT = 0.3; });
  say(kevin, 'Direction Josiane !', 1.5);
  return true;
}
/** Josiane rachète une liste d'objets. Le 1er exemplaire de chaque épique/légendaire part dans la vitrine (bonus permanent). */
function sellBag(list, at){
  let v = 0, n = 0; const kept = [];
  for(const it of list){
    const key = it[0] + '_' + it[1], r = itemOf(it)[2];
    if((r === 'e' || r === 'l') && !S.vit[key]){ S.vit[key] = 1; kept.push(itemOf(it)); continue; }
    v += itemValue(it); n++;
  }
  earn(v); S.st.sold += n;
  if(HEADLESS) return v;
  sfx('coin');
  if(ANIM()) for(let i = 0; i < Math.min(14, 3 + n); i++) parts.push({x:tx(at.c) + rnd(-10, 10), y:ty(at.r) - 30, vx:rnd(-50, 50), vy:rnd(-160, -80), g:260, life:1.1, t:0, kind:'coin'});
  pops.push({x:tx(at.c), y:ty(at.r) - 55, txt:'+' + eur(v), col:'#ffd84f', t:0, life:1.8, big:true});
  if(kept.length) UI.toast('🏛️ Vitrine : ' + kept.map(k => k[0] + ' ' + k[1]).join(', ') + ' (bonus permanent !)', 'gold');
  else UI.toast('💶 Josiane rachète ' + n + ' objet' + (n > 1 ? 's' : '') + ' : +' + eur(v), 'gold');
  UI.bump();

}
function earn(x){ if(!(x > 0)) return; S.money += x; S.st.earned += x; S.meta.life.earned += x; }
function taken(c, r, ent){
  for(const w of workers) if(w !== ent && w.claim && w.claim.c === c && w.claim.r === r) return true;
  if(ent !== kevin && ((kevin.target && kevin.target.c === c && kevin.target.r === r) || (kevin.goal && kevin.goal.c === c && kevin.goal.r === r))) return true;
  return false;
}
/** Choix automatique du prochain tas. Kévin : même quartier si possible, au plus près. Employés : le quartier le plus profond. */
function autoNext(ent){
  const {b, list} = reachableHeaps(ent);
  const free = list.filter(h => !taken(h.c, h.r, ent) && !(ent !== kevin && h.c === S.disk.c && h.r === S.disk.r));
  if(!free.length) return false;
  let best;
  if(ent === kevin){ const same = free.filter(h => h.q === kevin.prefQ && h.d <= 14); best = (same.length ? same : free).reduce((a, h) => h.d < a.d ? h : a); }
  else best = free.reduce((a, h) => (h.q > a.q || (h.q === a.q && h.d < a.d)) ? h : a);
  const path = pathTo(b, best.from), c = best.c, r = best.r;
  if(ent !== kevin) ent.claim = {c, r}; else kevin.goal = {c, r};
  goTo(ent, path, () => { ent.target = {c, r}; if(ent === kevin) kevin.goal = null; });
  return true;
}
/** Tire un objet trouvé dans le quartier q (minR = rareté minimale) */
function rollItem(q, minR){
  const L = luck(); let tw = 0; const w = {};
  for(const r of RK){ w[r] = (minR && RK.indexOf(r) < RK.indexOf(minR)) ? 0 : RAR[r].w * (RAR[r].lk ? L : 1); tw += w[r]; }
  let t = R() * tw, rr = minR || 'c'; for(const r of RK){ t -= w[r]; if(t <= 0 && w[r] > 0){ rr = r; break; } }
  const idx = []; LOOT[q].forEach((x, i) => { if(x[2] === rr) idx.push(i); });
  return [q, pick(idx), Math.round((0.8 + R() * 0.4) * 100) / 100];
}
function noteFind(it){
  const r = itemOf(it)[2], key = it[0] + '_' + it[1];
  S.st.finds++; S.meta.life.finds++; S.col[key] = (S.col[key] || 0) + 1;
  if(r === 'r') S.st.rares++; if(r === 'e') S.st.epics++; if(r === 'l') S.st.legs++;
}
/** Un coup sur un tas (power = points de solidité retirés) */
function hit(ent, c, r, power){
  const t = tile(c, r); if(!t || !t.L) return;
  t.hp -= power;
  const sp = HEADLESS ? null : heapSprite(t.q, t.L, t.v, t.maxL);
  if(sp && ANIM()) for(let i = 0; i < 3; i++) parts.push({x:tx(c) + rnd(-14, 14), y:ty(r) - sp.top * 0.6 + rnd(-6, 6), vx:rnd(-70, 70), vy:rnd(-120, -40), g:300, life:0.6, t:0, kind:'dirt', col:QUARTERS[t.q].pal.top0});
  if(ent === kevin) sfx('dig');
  if(t.hp > 0) return;
  // la couche du dessus est vidée
  t.L--; S.st.layers++;
  const n = 1 + (R() < 0.35 ? 1 : 0), isK = ent === kevin;
  for(let i = 0; i < n; i++){
    const it = rollItem(t.q, t.mark && i === 0 && t.L === 0 ? 'e' : null); noteFind(it);
    const L = itemOf(it);
    if(isK){ S.bag.push(it);
      if(sp) pops.push({x:tx(c) + (i ? 16 : -6), y:ty(r) - sp.top - 30 - i * 14, e:L[0], txt:L[2] === 'c' ? '' : L[1], col:RCOL[L[2]], t:0, life:1.5, tx:kevin.x, ty:kevin.y - 30}); }
    else { const v = itemValue(it) * 0.8; earn(v); if(sp) pops.push({x:tx(c), y:ty(r) - sp.top - 30, txt:'+' + eur(v), col:'#ffd84f', t:0, life:1.3}); }
    if(isK) sfx(L[2] === 'l' ? 'leg' : L[2] !== 'c' ? 'rare' : 'item');
    if(L[2] === 'l') UI.toast('🏆 Légendaire : ' + L[0] + ' ' + L[1], 'gold');
  }
  if(sp && ANIM()){
    for(let i = 0; i < 12; i++) parts.push({x:tx(c) + rnd(-22, 22), y:ty(r) - sp.top * 0.5, vx:rnd(-110, 110), vy:rnd(-170, -50), g:320, life:0.9, t:0, kind:'dirt', col:i % 2 ? QUARTERS[t.q].pal.top0 : QUARTERS[t.q].pal.side});
    parts.push({x:tx(c), y:ty(r) - 10, life:0.7, t:0, kind:'puff', s:T * 0.8});
  }
  if(t.L > 0){ t.hp = hpMax(t); return; }
  // tas entièrement vidé : le sol réapparaît
  t.mark = false; S.st.heaps++; S.meta.life.heaps++; stampCleared(c, r); sfx('clear');
  if(c === S.story.c && r === S.story.r && !S.story.found) foundStory();
  if(c === S.disk.c && r === S.disk.r && !S.disk.found) foundDisk();
  if(isK){ kevin.target = null; kevin.autoT = 0.45; } else { ent.target = null; ent.claim = null; }
}
function foundStory(){
  S.story.found = true; sfx('leg'); sparkle(S.story.c, S.story.r);
  UI.toast('📦 Le boîtier du disque dur !', 'gold'); say(kevin, 'MON BOÎTIER !', 3);
  UI.queue({type:'dialog', lines:STORY_DLG.map(l => [l[0], l[1].replace('%SIDE%', S.side < 0 ? 'GAUCHE' : 'DROIT')])});
}
function foundDisk(){ S.disk.found = true; sfx('leg'); sparkle(S.disk.c, S.disk.r); say(kevin, 'MON DISQUE !!!', 4); }
function sparkle(c, r){ if(HEADLESS) return; for(let i = 0; i < 40; i++) parts.push({x:tx(c), y:ty(r) - 10, vx:rnd(-160, 160), vy:rnd(-260, -60), g:200, life:1.8, t:0, kind:'spark'}); }
function addWorkerEnt(type, quiet){
  const w = mkEnt(START.c + 1, START.r + 1); w.type = type; w.claim = null; w.idle = R(); w.face = -1;
  workers.push(w);
  if(!quiet) say(w, pick(['Je m\'en occupe, patron !', 'Ça sent bon le travail !', 'Où est la bouteille ?', 'Au boulot !']), 2.5);

const empPow = type => EMPS.find(e => e.id === type).pow * teamPow() * bm('emp');

/* =========================================================
   10. MISE À JOUR DU MONDE
   ========================================================= */
let detTimer = 0, detPulse = 0, detStrength = 0;
/** Cible du détecteur : le boîtier (une fois le Cimetière ouvert), puis le disque dur (une fois la Fosse ouverte) */
const detTarget = () => (!S.story.found && S.unlocked[2]) ? S.story : (!S.disk.found && S.unlocked[6]) ? S.disk : null;
function detStrengthTo(p){ if(!p || !S.up.det || !kevin) return 0; const d = Math.hypot(kevin.x - tx(p.c), kevin.y - ty(p.r)) / T; return clamp(1 - d / detRange(), 0, 1); }
function update(dt){
  S.st.time += dt; S.meta.life.time += dt;
  S.buffs = S.buffs.filter(b => b.until > S.st.time);
  const empOn = bm('emp') > 0;
  // --- Kévin ---
  const moving = moveEnt(kevin, dt, kevSpeed());
  const full = S.bag.length >= bagCap();
  if(!moving && kevin.target){
    const {c, r} = kevin.target, t = tile(c, r);
    if(!t || !t.L) kevin.target = null;
    else if(!full){ kevin.face = tx(c) >= kevin.x ? 1 : -1; kevin.dig += dt * 9; kevin.cd -= dt; if(kevin.cd <= 0){ kevin.cd = KEV_HIT; kevHit(c, r); } }
  } else if(!moving && !kevin.target && !full && kevin.autoT !== undefined){
    kevin.autoT -= dt; if(kevin.autoT <= 0){ kevin.autoT = undefined; autoNext(kevin); }
  }
  if(!moving && full && kevin.bubbleT <= -2) say(kevin, S.up.truck ? 'J\'attends le camion…' : 'Sac plein ! Je vais chez Josiane ?', 3);
  kevin.bubbleT -= dt;
  // --- Employés ---
  for(const w of workers){
    const mv = moveEnt(w, dt, w.type === 'dozer' || w.type === 'robot' ? 2.2 : 1.8);
    if(!mv && w.target){
      const t = tile(w.target.c, w.target.r);
      if(!t || !t.L){ w.target = null; w.claim = null; }
      else if(empOn){ w.face = tx(w.target.c) >= w.x ? 1 : -1; w.dig += dt * 6; w.cd -= dt; if(w.cd <= 0){ w.cd = WORKER_HIT; hit(w, w.target.c, w.target.r, empPow(w.type)); } }
    } else if(!mv && !w.target && !w.after){ w.idle -= dt; if(w.idle <= 0){ w.idle = 1 + R(); if(!autoNext(w)) w.claim = null; } }
    w.bubbleT -= dt;
  }
  // --- Camion de livraison ---
  if(S.up.truck) truckUpdate(dt);
  // --- Marché (une cotation par seconde) ---
  S.market.acc += dt; let steps = 0;
  while(S.market.acc >= 1 && steps++ < 120){ S.market.acc -= 1; marketStep(); }
  if(S.market.acc > 1) S.market.acc = 0;
  // --- Événements ---
  if(S.st.time >= S.nextEvent){ S.nextEvent = S.st.time + rnd(100, 170); if(!UI.busy() && S.st.time > 140) triggerEvent(); }
  // --- Détecteur ---
  const dtg = detTarget();
  if(S.up.det && dtg){
    detStrength = detStrengthTo(dtg); detTimer -= dt;
    if(detTimer <= 0){ detTimer = detStrength > 0 ? 1.6 - 1.45 * detStrength : 2.2; detPulse = 1; if(detStrength > 0) sfx('beep', detStrength); }
    detPulse = Math.max(0, detPulse - dt * 2);
  } else detStrength = 0;
  // --- Filet de sécurité : plus aucun tas accessible → la ville livre de nouvelles ordures ---
  S.refillT = (S.refillT || 0) + dt;
  if(S.refillT > 5){ S.refillT = 0; refillIfStuck(); }
  checkProgress();
  if(HEADLESS) return;
  // --- Effets visuels ---
  for(const p of parts){ p.t += dt; if(p.vx !== undefined){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; } }
  for(let i = parts.length - 1; i >= 0; i--) if(parts[i].t >= parts[i].life) parts.splice(i, 1);
  for(const p of pops) p.t += dt / Math.max(0.3, S.meta.settings.anim || 1);
  for(let i = pops.length - 1; i >= 0; i--) if(pops[i].t >= pops[i].life) pops.splice(i, 1);
  if(gulls.length < 4 && R() < dt * 0.25){ const fl = R() < 0.5; gulls.push({x:fl ? -MARGIN : COLS * T + MARGIN, y:rnd(cam.y - 300, cam.y + 300), vx:(fl ? 1 : -1) * rnd(50, 80), vy:rnd(-12, 12), ph:R() * 6}); }
  for(const g of gulls){ g.x += g.vx * dt; g.y += g.vy * dt; g.ph += dt * 7; }
  for(let i = gulls.length - 1; i >= 0; i--) if(gulls[i].x < -MARGIN * 1.5 || gulls[i].x > COLS * T + MARGIN * 1.5) gulls.splice(i, 1);
  if(cam.follow){ cam.x += (kevin.x - cam.x) * Math.min(1, dt * 3); cam.y += (kevin.y - 40 - cam.y) * Math.min(1, dt * 3); }
  clampCam();
}
/** Coup de Kévin (avec la pelleteuse, les tas voisins prennent aussi) */
function kevHit(c, r){
  const p = kevPower(), q = tile(c, r).q;
  hit(kevin, c, r, p);
  if(S.up.digger) for(const dc of [-1, 1]){ const t = tile(c + dc, r); if(t && t.L && t.q === q) hit(kevin, c + dc, r, p * 0.5); }
}
/** Toucher le tas en cours = un coup en plus */
let lastTap = -1;
function tapHit(){
  if(!kevin.target || kevin.path.length || S.bag.length >= bagCap()) return false;
  if(S.st.time - lastTap < 0.1) return false; lastTap = S.st.time;
  S.st.taps++; kevin.dig += 1.5; kevHit(kevin.target.c, kevin.target.r); return true;
}
function truckHome(){ const tr = truck; tr.state = 'home'; tr.path = []; tr.after = null; tr.x = tx(TRUCK_HOME.c); tr.y = ty(TRUCK_HOME.r); tr.c = TRUCK_HOME.c; tr.r = TRUCK_HOME.r; tr.ang = Math.PI / 2; }
function truckUpdate(dt){
  const tr = truck;
  if(tr.state === 'home' && S.bag.length >= Math.max(4, Math.floor(bagCap() * 0.5))){
    const path = findPath(tr.c, tr.r, (c, r) => Math.abs(c - kevin.c) + Math.abs(r - kevin.r) <= 1);
    if(path){ tr.state = 'go'; tr.wait = 0.8; goTo(tr, path, () => { tr.state = 'load'; }); }
  }
  if(tr.state === 'go'){ if(!moveEnt(tr, dt, 4.2) && tr.state === 'go') tr.state = 'load'; }
  else if(tr.state === 'load'){ tr.wait -= dt;
    if(tr.wait <= 0){ tr.load = tr.load.concat(S.bag); S.bag = []; tr.state = 'back';
      const path = findPath(tr.c, tr.r, (c, r) => c === TRUCK_HOME.c && r === TRUCK_HOME.r);
      if(path) goTo(tr, path, () => { sellBag(tr.load, SELL_TILE); tr.load = []; S.st.trips++; truckHome(); });
      else { sellBag(tr.load, SELL_TILE); tr.load = []; S.st.trips++; truckHome(); } } }
  else if(tr.state === 'back'){ if(!moveEnt(tr, dt, 4.2) && tr.state === 'back'){ sellBag(tr.load, SELL_TILE); tr.load = []; S.st.trips++; truckHome(); } }
}

/* =========================================================
   11. MARCHÉ CRYPTO
   ========================================================= */
const FEE = 0.01;
function marketBuy(frac){ const a = S.money * frac; if(a < 0.01) return 0; S.money -= a; S.btc += a * (1 - FEE) / S.market.p; S.btcCost += a; S.st.buys++; return a; }
function marketSell(frac){
  if(S.btc <= 0) return null;
  const q = frac >= 1 ? S.btc : S.btc * frac, proceeds = q * S.market.p * (1 - FEE), costPart = S.btcCost * (q / S.btc), profit = proceeds - costPart;
  S.btc -= q; S.btcCost -= costPart; if(S.btc < 1e-12){ S.btc = 0; S.btcCost = 0; }
  S.money += Math.min(proceeds, costPart); if(profit > 0) earn(profit);
  S.st.sells++; if(profit > S.st.bestTrade) S.st.bestTrade = profit; if(profit < S.st.worstTrade) S.st.worstTrade = profit;
  if(profit > S.meta.life.bestTrade) S.meta.life.bestTrade = profit;
  return profit;
}
function marketStep(){
  const m = S.market; m.target = clamp(m.target * Math.exp(0.004 * gauss()), 12000, 90000);
  let lp = Math.log(m.p); lp += 0.03 * (Math.log(m.target) - lp) + 0.012 * gauss();
  if(R() < 0.008) lp += (R() < 0.5 ? -1 : 1) * rnd(0.06, 0.16);
  m.p = clamp(Math.exp(lp), 3000, 300000); m.hist.push(m.p); if(m.hist.length > 90) m.hist.shift();
}
function marketShock(pct){ S.market.p *= (1 + pct); S.market.hist[S.market.hist.length - 1] = S.market.p; }

/* =========================================================
   12. ÉVÉNEMENTS ALÉATOIRES (choix aux conséquences différentes)
   ========================================================= */
function addBuff(k, m, dur, label){ S.buffs.push({k, m, until:S.st.time + dur, label, neg:m < 1}); }
const Rw = sec => Math.max(20, rewardSec(sec || 60));
const lose = pct => { const x = S.money * pct; S.money -= x; return eur(x); };
function bagLose(frac){ const n = Math.floor(S.bag.length * frac); if(!n) return 0; S.bag.sort(() => R() - 0.5); S.bag.splice(0, n); return n; }
function giveBag(minR){ const it = rollItem(deepestOpen(), minR); noteFind(it); S.bag.push(it); return itemOf(it); }
/** Le camion-benne déverse : quelques tas vidés se recouvrent (visible dans le monde) */
function dumpTrash(n){
  const list = [];

function checkProgress(){

    const q = QUESTS[S.quest], x = Math.max(q.r[1], q.r[0] ? Rw(q.r[0]) : 0);

  }

    const ch = CHAPTERS[S.chapter]; S.chapterTimes.push(S.st.time);
    if(S.chapter < CHAPTERS.length - 1){ S.chapter++; UI.queue({type:'dialog', lines:ch.dlg, after:()=>UI.chapterBanner(S.chapter)}); }

}

function merge(def, obj){
  if(obj === null || typeof obj !== 'object' || Array.isArray(def) || typeof def !== 'object' || def === null) return obj === undefined ? def : obj;
  const out = {...def}; for(const k in obj) out[k] = (k in def) ? merge(def[k], obj[k]) : obj[k]; return out;
}

const AUD = {ctx:null, timer:null, nextT:0, step:0};

function audioInit(){
  if(HEADLESS) return;
  if(AUD.ctx){ if(AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  const c = AUD.ctx = new AC();
  AUD.out = c.createGain(); AUD.out.gain.value = 0.55; AUD.out.connect(c.destination);
  AUD.music = c.createGain(); AUD.music.gain.value = 0; AUD.music.connect(c.destination);
  const len = c.sampleRate * 0.5, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = R() * 2 - 1; AUD.noise = buf;
  musicUpdate();
}
function tone(f, t, dur, type, vol, f2, dest){ const c = AUD.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(dest || AUD.out); o.start(t); o.stop(t + dur + 0.05); }
function noise(t, dur, freq, vol, q){ const c = AUD.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = AUD.noise;
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AUD.out); s.start(t, R() * 0.3); s.stop(t + dur + 0.02); }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function sfx(n, x){
  if(HEADLESS || !AUD.ctx || !settings().sound) return; const t = AUD.ctx.currentTime;
  switch(n){
    case 'dig': noise(t, 0.16, rnd(500, 900), 0.5, 0.8); tone(rnd(90, 120), t, 0.1, 'sine', 0.22, 50); break;
    case 'clear': noise(t, 0.35, 300, 0.45, 0.6); tone(520, t + 0.05, 0.12, 'triangle', 0.14); tone(780, t + 0.12, 0.15, 'triangle', 0.14); break;
    case 'item': tone(880, t, 0.08, 'triangle', 0.16); tone(1320, t + 0.06, 0.1, 'triangle', 0.13); break;
    case 'rare': [72, 76, 79, 84].forEach((m, i) => tone(mtof(m), t + i * 0.06, 0.18, 'square', 0.07)); break;
    case 'leg': [72, 76, 79, 84, 88, 91].forEach((m, i) => { tone(mtof(m), t + i * 0.08, 0.4, 'square', 0.07); tone(mtof(m + 12), t + i * 0.08, 0.3, 'sine', 0.05); }); break;
    case 'coin': for(let i = 0; i < 5; i++){ tone(1500 + i * 120, t + i * 0.06, 0.08, 'square', 0.05); tone(2200 + i * 150, t + i * 0.06 + 0.03, 0.1, 'square', 0.04); } break;
    case 'buy': tone(1200, t, 0.06, 'square', 0.07); tone(1800, t + 0.05, 0.12, 'square', 0.06); break;
    case 'click': tone(rnd(520, 640), t, 0.05, 'square', 0.06, 300); break;
    case 'unlock': [60, 64, 67, 72].forEach((m, i) => tone(mtof(m), t + i * 0.1, 0.3, 'square', 0.07)); break;
    case 'chapter': [60, 64, 67, 72, 67, 72, 76].forEach((m, i) => tone(mtof(m), t + i * 0.12, 0.35, 'square', 0.07)); break;
    case 'event': tone(440, t, 0.15, 'square', 0.07); tone(330, t + 0.15, 0.2, 'square', 0.07); break;
    case 'error': tone(180, t, 0.18, 'sawtooth', 0.09, 120); break;
    case 'beep': tone(900 + (x || 0) * 900, t, 0.07, 'sine', 0.1 + (x || 0) * 0.15); break;
  }
}
/* Petite musique d'ambiance : boucle Lam - Fa - Do - Sol générée en direct */
const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], PENTA = [69, 72, 74, 76, 79, 81];
function musicUpdate(){
  if(!AUD.ctx) return; const on = settings().music;
  AUD.music.gain.setTargetAtTime(on ? 0.05 : 0, AUD.ctx.currentTime, 0.3);
  if(on && !AUD.timer){ AUD.nextT = AUD.ctx.currentTime + 0.1; AUD.timer = setInterval(musicSched, 60); }
  if(!on && AUD.timer){ clearInterval(AUD.timer); AUD.timer = null; }
}
function musicSched(){
  const c = AUD.ctx, beat = 60 / 88 / 2;
  while(AUD.nextT < c.currentTime + 0.25){
    const t = AUD.nextT, s = AUD.step, chord = PROG[Math.floor(s / 8) % 4];
    if(s % 8 === 0) chord.forEach(m => tone(mtof(m), t, beat * 7.5, 'triangle', 0.22, null, AUD.music));
    if(s % 4 === 0) tone(mtof(chord[0] - 12), t, beat * 1.8, 'sine', 0.5, null, AUD.music);
    if(s % 2 === 1 && R() < 0.3) tone(mtof(pick(PENTA)), t, beat * 1.5, 'sine', 0.18, null, AUD.music);
    if(s % 2 === 0) tone(4000, t, 0.03, 'square', 0.015, null, AUD.music);
    AUD.nextT += beat; AUD.step++;
  }
}

function resize(){

  if(!cam.init){ cam.z = clamp(VW / (7.2 * T), cam.zMin, cam.zMax); cam.init = true; }

function clampCam(){
  cam.z = clamp(cam.z, cam.zMin, cam.zMax);
  const hw = VW / 2 / cam.z, hh = VH / 2 / cam.z, minX = -MARGIN + hw, maxX = COLS * T + MARGIN - hw;
  cam.x = minX > maxX ? COLS * T / 2 : clamp(cam.x, minX, maxX);

}
const toWorld = (sx, sy) => [(sx - VW / 2) / cam.z + cam.x, (sy - VH / 2) / cam.z + cam.y];
function render(time){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#3f5c2e'; ctx.fillRect(0, 0, VW, VH);
  ctx.setTransform(DPR * cam.z, 0, 0, DPR * cam.z, DPR * (VW / 2 - cam.x * cam.z), DPR * (VH / 2 - cam.y * cam.z));
  ctx.drawImage(groundCv, -MARGIN, -MARGIN);
  const [wx0, wy0] = toWorld(0, 0), [wx1, wy1] = toWorld(VW, VH);
  const r0 = Math.max(0, Math.floor(wy0 / T) - 1), r1 = Math.min(ROWS - 1, Math.ceil(wy1 / T) + 3);
  const c0 = Math.max(0, Math.floor(wx0 / T) - 1), c1 = Math.min(COLS - 1, Math.ceil(wx1 / T) + 1);
  // indices : moitié de la Fosse surlignée (boîtier trouvé), cercle du drone
  if(S.story.found && !S.disk.found){
    const x0 = S.side < 0 ? 0 : COLS * T / 2; ctx.fillStyle = 'rgba(255,210,80,' + (0.08 + 0.05 * Math.sin(time * 2)) + ')'; ctx.fillRect(x0, rowStart(6) * T, COLS * T / 2, QROWS * T);
  }
  if(S.up.drone && !S.disk.found){ const ox = ((S.seed % 7) - 3) * 0.4, oy = ((S.seed % 5) - 2) * 0.4;
    ctx.strokeStyle = 'rgba(255,90,60,' + (0.5 + 0.3 * Math.sin(time * 3)) + ')'; ctx.lineWidth = 4; ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.ellipse(tx(S.disk.c) + ox * T, ty(S.disk.r) + oy * T, T * 3.2, T * 2.6, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  for(const p of [S.story, S.disk]) if(p.found && !tiles[p.r][p.c].L){ ctx.save(); ctx.translate(tx(p.c), ty(p.r)); ITEM.hdd(ctx, 24, () => 0.2); ctx.restore();
    ctx.strokeStyle = 'rgba(255,220,80,' + (0.5 + 0.5 * Math.sin(time * 6)) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(tx(p.c), ty(p.r), 22, 0, 7); ctx.stroke(); }
  if(running && S.up.det && detPulse > 0 && detStrength > 0){
    const col = detStrength > 0.66 ? '255,80,60' : detStrength > 0.33 ? '255,200,60' : '120,230,140', rr = (1 - detPulse) * 70 + 10;
    ctx.strokeStyle = 'rgba(' + col + ',' + detPulse * 0.8 + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(kevin.x, kevin.y, rr, rr * 0.6, 0, 0, 7); ctx.stroke();
  }
  // tapis d'ordures, puis tas rangée par rangée avec les personnages
  for(let r = r0; r <= r1; r++) for(let c = c0; c <= c1; c++){ const t = tiles[r][c]; if(!t.L) continue; const sk = skirtSprite(t.q, t.v); ctx.drawImage(sk.cv, tx(c) + t.ox - sk.ax, ty(r) + t.oy - sk.ay, sk.w, sk.h); }
  const ents = [{e:kevin, k:'k'}, ...workers.map(w => ({e:w, k:'w'}))];
  if(S.up.truck) ents.push({e:truck, k:'t'});
  for(let r = r0; r <= r1; r++){
    const q = qOfRow(r);
    for(let c = c0; c <= c1; c++){
      const t = tiles[r][c]; if(!t.L) continue;
      const sp = heapSprite(t.q, t.L, t.v, t.maxL), k = t.sc * (1 - 0.07 * clamp(1 - t.hp / hpMax(t), 0, 1)), x = tx(c) + t.ox, y = ty(r) + t.oy + T * 0.1;
      if(t.flip){ ctx.save(); ctx.translate(x, 0); ctx.scale(-1, 1); ctx.drawImage(sp.cv, -sp.ax * k, y - sp.ay * k, sp.w * k, sp.h * k); ctx.restore(); }
      else ctx.drawImage(sp.cv, x - sp.ax * k, y - sp.ay * k, sp.w * k, sp.h * k);
      if(t.mark){ const sy = y - sp.top * k - 30 + Math.sin(time * 4 + c) * 4; ctx.font = '22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('✨', x, sy); }
    }
    if(r === HUT.r + HUT.h - 1){ drawHut(ctx); person(ctx, tx(SELL_TILE.c) + 22, ty(HUT.r + 1) + 20, {shirt:'#7a4b8a', apron:'#4f86c6', hat:'bun', hair:'#c8c8c8', face:-1, glasses:true, pants:'#4a3a4a'}); }
    for(const o of ents) if(Math.round((o.e.y - T / 2) / T) === r) drawEnt(o, time);
    const qn = qOfRow(r + 1); if(q >= 0 && qn >= 0 && qn !== q) drawFence(ctx, q);
  }
  for(let q = 1; q < NQ; q++) if(!S.unlocked[q] && S.unlocked[q - 1] && rowStart(q - 1) >= r0 - 3 && rowStart(q - 1) <= r1 + 3) drawSign(ctx, q);
  for(const p of parts){ const a = 1 - p.t / p.life; ctx.globalAlpha = a;
    if(p.kind === 'dirt'){ ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    else if(p.kind === 'coin'){ ctx.fillStyle = '#ffcf3a'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 5 * Math.abs(Math.cos(p.t * 12)) + 1, 5, 0, 0, 7); ctx.fill(); }
    else if(p.kind === 'spark'){ ctx.fillStyle = p.t % 0.2 < 0.1 ? '#fff6b0' : '#ffcf3a'; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    else if(p.kind === 'puff'){ ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#d8c8a8'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.s * (0.5 + p.t), p.s * 0.4 * (0.5 + p.t), 0, 0, 7); ctx.fill(); } }
  ctx.globalAlpha = 1;
  for(const g of gulls){ ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(g.x + 30, g.y + 60, 7, 3, 0, 0, 7); ctx.fill();
    const fl = Math.sin(g.ph) * 6; ctx.strokeStyle = '#f4f4f0'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(g.x - 10, g.y - fl); ctx.quadraticCurveTo(g.x - 4, g.y - 4, g.x, g.y); ctx.quadraticCurveTo(g.x + 4, g.y - 4, g.x + 10, g.y - fl); ctx.stroke(); }
  if(S.up.drone && !S.disk.found){ const dx = tx(S.disk.c) + Math.cos(time * 0.7) * T * 3, dy = ty(S.disk.r) + Math.sin(time * 0.7) * T * 2 - 60;
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(dx + 20, dy + 70, 12, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8e8ec'; ctx.fillRect(dx - 8, dy - 4, 16, 8); ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    for(const [ax, ay] of [[-11, -7], [11, -7], [-11, 7], [11, 7]]){ ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + ax, dy + ay); ctx.stroke(); ctx.beginPath(); ctx.ellipse(dx + ax, dy + ay, 6 * Math.abs(Math.sin(time * 30)) + 0.5, 1.5, 0, 0, 7); ctx.stroke(); }
    ctx.fillStyle = Math.sin(time * 8) > 0 ? '#ff4040' : '#40ff60'; ctx.beginPath(); ctx.arc(dx, dy, 2, 0, 7); ctx.fill(); }
  for(const p of pops){ const k = p.t / p.life; let x = p.x, y = p.y - k * 40;
    if(p.tx !== undefined && k > 0.55){ const m = (k - 0.55) / 0.45; x = p.x + (p.tx - p.x) * m; y = (p.y - 22) + (p.ty - p.y + 22) * m - Math.sin(m * 3.14) * 30; }
    const al = k > 0.85 ? (1 - k) / 0.15 : 1; ctx.globalAlpha = al;
    if(p.e){ ctx.fillStyle = p.col === RCOL.c ? 'rgba(0,0,0,.35)' : p.col; ctx.globalAlpha = al * 0.55; ctx.beginPath(); ctx.arc(x, y - 6, 15, 0, 7); ctx.fill(); ctx.globalAlpha = al;
      ctx.font = '20px system-ui'; ctx.textAlign = 'center'; ctx.fillText(p.e, x, y + 1); }
    if(p.txt && (p.tx === undefined || k < 0.6)){ ctx.font = (p.big ? 'bold 16px' : 'bold 11px') + ' system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.strokeText(p.txt, x, y + (p.e ? 22 : 0)); ctx.fillStyle = p.col; ctx.fillText(p.txt, x, y + (p.e ? 22 : 0)); } }
  ctx.globalAlpha = 1;
  for(const e of [kevin, ...workers]) if(e.bubble && e.bubbleT > 0) bubble(e.x, e.y - (e === kevin && S.up.digger ? 64 : 58), e.bubble);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  vg.addColorStop(0, 'rgba(255,220,160,0)'); vg.addColorStop(1, 'rgba(30,15,0,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
}
function drawEnt(o, time){
  const e = o.e, walking = e.path.length > 0, digP = e.target && !walking ? e.dig : 0;
  if(o.k === 'k'){
    const fill = S.bag.length / bagCap();
    if(S.up.digger) digger(ctx, e.x, e.y, e.face, digP ? Math.sin(digP) : 0, fill);
    else person(ctx, e.x, e.y, {shirt:'#f7931a', logo:'₿', beard:'#6a4424', hair:'#6a4424', face:e.face, walk:e.walk, walking, dig:digP, tool:toolTier(), bag:0.35 + Math.min(1.6, S.up.sac * 0.16), fill, brouette:S.up.brou});
    if(e.target){ const t = tile(e.target.c, e.target.r); if(t && t.L){ const sp = heapSprite(t.q, t.L, t.v, t.maxL), x = tx(e.target.c), y = ty(e.target.r) - sp.top - 24;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(x - 21, y - 4, 42, 8, 4); ctx.fill();
      ctx.fillStyle = '#ffd84f'; ctx.beginPath(); ctx.roundRect(x - 20, y - 3, 40 * clamp(1 - t.hp / hpMax(t), 0, 1) + 0.1, 6, 3); ctx.fill();
      ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000a'; ctx.lineWidth = 3;
      const lb = 'couche ' + t.L + '/' + t.maxL; ctx.strokeText(lb, x, y - 8); ctx.fillText(lb, x, y - 8); } }
  } else if(o.k === 't') drawTruckTop(ctx, e.x, e.y, e.ang || 0, e.load.length + (e.state === 'load' ? S.bag.length : 0));
  else { const k = e.type;
    if(k === 'chien') dog(ctx, e.x, e.y, e.face, e.walk, digP);
    else if(k === 'dozer') miniDozer(ctx, e.x, e.y, e.face, e.walk, digP);
    else if(k === 'robot') robot(ctx, e.x, e.y, e.face, e.walk, digP, time);
    else person(ctx, e.x, e.y, {...LOOKS[k], face:e.face, walk:e.walk, walking, dig:digP, tool:k === 'ferr' ? 1 : 0}); }

function bubble(x, y, txt){
  ctx.font = 'bold 12px system-ui'; const w = ctx.measureText(txt).width + 18;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.roundRect(x - w / 2 + 2, y - 24, w, 24, 10); ctx.fill();
  ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 26, w, 24, 10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 5, y - 3); ctx.lineTo(x + 5, y - 3); ctx.lineTo(x, y + 5); ctx.fill();
  ctx.fillStyle = '#2a1a08'; ctx.textAlign = 'center'; ctx.fillText(txt, x, y - 10);
}

function drawChart(){
  const c = $('#chart'); if(!c) return;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; if(!w) return;
  if(c.width !== Math.round(w * dpr)){ c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const d = S.market.hist; let mn = Math.min(...d), mx = Math.max(...d); const pad = (mx - mn) * 0.1 || mx * 0.01; mn -= pad; mx += pad;
  const X = i => i / (d.length - 1) * w, Y = v => h - (v - mn) / (mx - mn) * h, col = d[d.length - 1] >= d[0] ? '#3ee08f' : '#ff5d6c';
  g.strokeStyle = '#ffffff12'; g.lineWidth = 1; for(let i = 1; i < 4; i++){ g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke(); }
  g.beginPath(); d.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.strokeStyle = col; g.lineWidth = 2; g.stroke();
  g.lineTo(w, h); g.lineTo(0, h); g.closePath(); const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, col + '55'); gr.addColorStop(1, col + '00'); g.fillStyle = gr; g.fill();
  if(S.btc > 0){ const avg = S.btcCost / S.btc / (1 - FEE); if(avg > mn && avg < mx){ g.setLineDash([5, 4]); g.strokeStyle = '#ffcf3a'; g.beginPath(); g.moveTo(0, Y(avg)); g.lineTo(w, Y(avg)); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ffcf3a'; g.font = '11px system-ui'; g.fillText('votre prix moyen', 6, Y(avg) - 4); } }
  g.fillStyle = '#d8ccb6'; g.font = '11px system-ui'; g.fillText(eur(mx), 6, 13); g.fillText(eur(mn), 6, h - 5);
}

/* ---- Monde : toucher un tas, glisser pour regarder, pincer pour zoomer ---- */
const ptrs = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => { audioInit(); if(!running || UI.modalOpen) return; cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(UI.sheet){ UI.closeSheet(); ptrs.delete(e.pointerId); return; }
  if(ptrs.size === 1) drag = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false};
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y) || 1, z:cam.z}; drag = null; } });
cv.addEventListener('pointermove', e => { if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinch && ptrs.size === 2){ const [a, b] = [...ptrs.values()]; cam.z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, cam.zMin, cam.zMax); cam.follow = false; clampCam(); return; }
  if(drag){ const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if(Math.hypot(dx, dy) > 10) drag.moved = true;
    if(drag.moved){ cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; cam.follow = false; clampCam(); } } });
function endPtr(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(drag && !drag.moved && ptrs.size === 0) onTap(e.clientX, e.clientY);
  if(ptrs.size < 2) pinch = null; if(ptrs.size === 0) drag = null; }
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); drag = null; pinch = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); if(!running) return; cam.z = clamp(cam.z * (e.deltaY < 0 ? 1.12 : 0.89), cam.zMin, cam.zMax); cam.follow = false; clampCam(); }, {passive:false});
/** Toucher dans le monde : portail, cabane, tas, ou sol */
function onTap(sx, sy){
  if(!running || UI.modalOpen) return;
  const [wx, wy] = toWorld(sx, sy), c = Math.floor(wx / T);
  for(let q = 1; q < NQ; q++){ const gy = rowStart(q - 1) * T; if(!S.unlocked[q] && S.unlocked[q - 1] && wy > gy - 80 && wy < gy + 10 && wx > GATE * T - 80 && wx < GATE * T + T + 80){
    if(unlockQ(q)) return; UI.toast('🔒 ' + QUARTERS[q].n + ' : il faut ' + eur(QUARTERS[q].cost) + '.', 'bad'); sfx('error'); return; } }
  if(wx >= HUT.c * T - 10 && wx <= (HUT.c + HUT.w) * T + 10 && wy >= HUT.r * T - 40 && wy <= (HUT.r + HUT.h) * T){ ACTIONS.sell(); return; }
  let best = null;
  for(let r = Math.floor(wy / T) + 3; r >= Math.floor(wy / T) - 1 && !best; r--){
    for(const cc of [c, c - 1, c + 1]){ const t = tile(cc, r); if(!t || !t.L) continue;
      const sp = heapSprite(t.q, t.L, t.v, t.maxL), cx = tx(cc) + t.ox;
      if(Math.abs(wx - cx) <= T * 0.55 && wy >= ty(r) - sp.top - sp.ry * 0.7 && wy <= ty(r) + sp.ry * 0.6){ best = [cc, r]; break; } }
  }
  if(best){
    if(kevin.target && kevin.target.c === best[0] && kevin.target.r === best[1] && !kevin.path.length){
      if(!tapHit() && S.bag.length >= bagCap()) say(kevin, 'Sac plein !', 1.5);
    } else { cam.follow = true; if(orderDig(best[0], best[1])) sfx('click'); }
    return;
  }
  const r = Math.floor(wy / T);
  if(walkable(c, r)){ const path = findPath(kevin.c, kevin.r, (pc, pr) => pc === c && pr === r); if(path){ kevin.target = null; kevin.goal = null; kevin.autoT = undefined; goTo(kevin, path, null); cam.follow = true; } }
}

function frame(now){
  let dt = (now - last) / 1000; last = now;
  if(running && S && !HEADLESS){
    if(dt > 60){ const off = applyOffline(dt); if(off) UI.toast('🌙 Pendant votre absence : +' + eur(off.money), 'good'); dt = 0.05; }
    dt = Math.min(dt, 0.1);
    update(dt);
    hudAcc += dt; saveAcc += dt;
    if(hudAcc > 0.2){ hudAcc = 0; UI.hud(); }
    if(saveAcc > 10){ saveAcc = 0; save(); }
  }
  if(S && kevin && groundCv && !HEADLESS) render(now / 1000);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); else if(AUD.ctx && AUD.ctx.state === 'suspended') AUD.ctx.resume(); });
addEventListener('pagehide', save);
(function init(){
  resize();
  const s = loadSave(); $('#btnContinue').disabled = !s;
  titleMeta = s ? s.meta : defaultMeta();
  if(!s){ try{ const st = JSON.parse(localStorage.getItem(SAVE_KEY + '_set') || 'null'); if(st) titleMeta.settings = {...titleMeta.settings, ...st}; }catch(e){} }
  // une décharge de démonstration en fond de l'écran titre (pas sauvegardée)
  S = newState(titleMeta); startWorld(); cam.follow = false; cam.y = ty(NQ * QROWS) - 80; clampCam();
  applyAnim();
  requestAnimationFrame(frame);
})();

window.GAME = {
  get S(){ return S; }, set S(v){ S = v; }, get kevin(){ return kevin; }, get workers(){ return workers; }, get truck(){ return truck; }, get tiles(){ return tiles; },
  get running(){ return running; },
  newState, startWorld, update, orderDig, orderSell, autoNext, tapHit, buyLeveled, buySack, buyOnce, hire, unlockQ, empCost, costLv, marketBuy, marketSell,
  doPrestige, applyOffline, triggerEvent, resolveEvent, reachableHeaps, teamIncome, rewardSec, clearedCount, deepestOpen, karmaGain, bagCap, serialize, parseSave, loadSave, save,
  detStrengthTo, QUARTERS, LEVELED, ONCE, SACKS, EMPS, UI, cam, rowStart, ROWS, COLS, NQ, QROWS, GATE,
  headless(on){ HEADLESS = on; if(on) running = false; },
};
