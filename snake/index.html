<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{--bg:#f1f5ea;--board:#dfe8d2;--ink:#1f2d1a;--snake:#2f6b3a;--head:#1b4a26;--food:#e0453a;--btn:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--board:#1c2820;--ink:#e6f0e0;--snake:#6fcf85;--head:#a8f0b8;--food:#ff6b5e;--btn:#25352a}}
:root[data-theme="dark"]{--bg:#121a14;--board:#1c2820;--ink:#e6f0e0;--snake:#6fcf85;--head:#a8f0b8;--food:#ff6b5e;--btn:#25352a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;touch-action:none}
h1{margin:0;font-size:1.6rem}
.score{font-size:1.1rem}
canvas{width:min(92vw,360px);height:min(92vw,360px);background:var(--board);border-radius:10px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
.pad button{font-size:1.5rem;border:0;border-radius:12px;background:var(--btn);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pad button:active{transform:scale(.94)}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#start{font:inherit;font-size:1.1rem;padding:10px 22px;border:0;border-radius:10px;background:var(--snake);color:var(--bg)}
</style>
</head>
<body>
<h1>Snake</h1>
<div class="score">Score : <span id="s">0</span> · Record : <span id="b">0</span></div>
<canvas id="c" width="360" height="360"></canvas>
<button id="start">Jouer</button>
<div class="pad">
<button class="up" data-d="0,-1" aria-label="Haut">▲</button>
<button class="left" data-d="-1,0" aria-label="Gauche">◀</button>
<button class="down" data-d="0,1" aria-label="Bas">▼</button>
<button class="right" data-d="1,0" aria-label="Droite">▶</button>
</div>
<script>
const N=18,C=360/N,cv=document.getElementById('c'),x=cv.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let snake,dir,next,food,score,best=0,timer,running=false;
function reset(){snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir=next={x:1,y:0};score=0;place();upd();draw()}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function upd(){document.getElementById('s').textContent=score;document.getElementById('b').textContent=best}
function setDir(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){return over()}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;if(score>best)best=score;place();upd();clearInterval(timer);timer=setInterval(step,Math.max(70,140-score*4))}
else snake.pop();
draw()}
function draw(){x.clearRect(0,0,360,360);
x.fillStyle=css('--food');x.beginPath();x.arc(food.x*C+C/2,food.y*C+C/2,C/2-2,0,7);x.fill();
snake.forEach((p,i)=>{x.fillStyle=css(i?'--snake':'--head');x.beginPath();x.roundRect(p.x*C+1,p.y*C+1,C-2,C-2,5);x.fill()})}
function over(){clearInterval(timer);running=false;const b=document.getElementById('start');b.textContent='Rejouer';b.style.display='';x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,360,360);x.fillStyle='#fff';x.font='bold 28px Georgia';x.textAlign='center';x.fillText('Perdu ! Score : '+score,180,185)}
function start(){reset();running=true;document.getElementById('start').style.display='none';timer=setInterval(step,140)}
document.getElementById('start').onclick=start;
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const[d,f]=b.dataset.d.split(',').map(Number);setDir(d,f)}));
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();setDir(...m)}});
let t0;cv.addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
cv.addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy))});
reset();
</script>
</body>
</html>
